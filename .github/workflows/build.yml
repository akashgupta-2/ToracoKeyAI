- name: Verify project and dictionary assets
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -s app/src/main/assets/toracokey_words.tsv.gz
          test -s app/src/main/assets/gboard_shortcuts.tsv

          grep -Fq 'versionName = "0.48.1"' app/build.gradle.kts
          grep -Fq 'versionCode = 60' app/build.gradle.kts
          grep -Fq 'const val APP_VERSION = "0.48.1"' \
            app/src/main/java/com/toracokey/ai/DeviceControl.kt
          grep -Fq 'Deduplicate defensively' \
            app/src/main/java/com/toracokey/ai/WordSuggestions.kt

          python3 - <<'PYCODE'
          import gzip
          from pathlib import Path
          from collections import Counter

          path = Path(
              "app/src/main/assets/toracokey_words.tsv.gz"
          )

          with gzip.open(path, "rt", encoding="utf-8") as f:
              rows = [
                  line.strip()
                  for line in f
                  if line.strip()
              ]

          words = [
              row.split("\t", 1)[0].strip().casefold()
              for row in rows
              if row.split("\t", 1)[0].strip()
          ]

          if not words:
              raise SystemExit("ERROR: Dictionary is empty.")

          counts = Counter(words)
          duplicate_count = sum(
              count - 1 for count in counts.values()
          )

          print(f"Dictionary entries: {len(words)}")
          print(f"Unique normalized words: {len(counts)}")
          print(f"Duplicate entries: {duplicate_count}")

          if duplicate_count:
              print(
                  "WARNING: Duplicate entries found. "
                  "Continuing build; runtime deduplication "
                  "must be verified separately."
              )

          print("Dictionary asset validation passed.")
          PYCODE
