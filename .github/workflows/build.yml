
name: Build ToracoKey AI v0.48.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Check Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f settings.gradle.kts ] || [ ! -f app/build.gradle.kts ]; then
            echo "::error::Android Gradle project files were not found at repository root."
            echo "Repository files:"
            ls -la
            exit 1
          fi

          echo "Android project files found."

          if [ -s app/src/main/assets/toracokey_words.tsv.gz ]; then
            echo "Dictionary asset found."
          else
            echo "::warning::Dictionary asset is missing or empty."
          fi

          if [ -s app/src/main/assets/gboard_shortcuts.tsv ]; then
            echo "Shortcut asset found."
          else
            echo "::warning::Shortcut asset is missing or empty."
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.48.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
