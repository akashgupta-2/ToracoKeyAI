
name: Build ToracoKey AI v0.44.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/ToracoKeyAI_v0.44.0_VERSION_ENFORCEMENT.zip"
          PROJECT_DIR="$RUNNER_TEMP/toracokey-project"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Expected project ZIP was not found:"
            echo "$ZIP"
            echo "ZIP files available in repository:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip'
            exit 1
          fi

          mkdir -p "$PROJECT_DIR"
          unzip -q "$ZIP" -d "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found at ZIP root."
            find "$PROJECT_DIR" -maxdepth 4 -type f | head -200
            exit 1
          fi

          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/toracokey/ai/WordSuggestions.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/toracokey/ai/DeviceControl.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/toracokey/ai/ToracoKeyService.kt"
          test -s "$PROJECT_DIR/app/src/main/assets/toracokey_words.tsv.gz"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project extracted and verified."

      - name: Verify app version and update enforcement
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -Fq 'versionName = "0.44.0"' app/build.gradle.kts
          grep -Fq 'versionCode = 55' app/build.gradle.kts

          grep -Fq 'X-ToracoKey-App-Version' \
            app/src/main/java/com/toracokey/ai/DeviceControl.kt

          grep -Fq 'X-ToracoKey-App-Version' \
            app/src/main/java/com/toracokey/ai/ToracoKeyService.kt

          grep -Fq 'if (code == 426)' \
            app/src/main/java/com/toracokey/ai/DeviceControl.kt

          grep -Fq 'if (status == 426)' \
            app/src/main/java/com/toracokey/ai/ToracoKeyService.kt

          echo "ToracoKey AI v0.44.0 source checks passed."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.44.0-debug-APK
          path: ${{ runner.temp }}/toracokey-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
