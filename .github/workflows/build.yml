name: Build ToracoKey AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract ToracoKey v0.37 ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="ToracoKeyAI_v0.37_UserControl.zip"

          echo "Looking for: $ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found!"
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          rm -rf toracokey_project
          mkdir -p toracokey_project

          unzip -q "$ZIP_FILE" -d toracokey_project

          echo "ZIP extracted successfully."

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT
