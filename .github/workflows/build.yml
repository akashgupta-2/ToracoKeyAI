- name: Extract Android project
        run: |
          set -e
          ZIP="ToracoKeyAI_v0.48.0_DICTIONARY_AI_CLEANUP.zip"

          if [ ! -f "$ZIP" ]; then
            echo "Project ZIP not found: $ZIP"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          GRADLE_FILE=$(find extracted -type f -name gradlew | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "No Gradle wrapper found in the ZIP."
            find extracted -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.48.0-Dictionary-Update
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
