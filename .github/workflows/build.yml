name: Build ToracoKey AI v0.37.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "======================================"
          echo "Android project verified"
          echo "======================================"

          echo "Project root:"
          pwd

          echo "settings.gradle.kts: OK"
          echo "build.gradle.kts: OK"
          echo "app/build.gradle.kts: OK"
          echo "AndroidManifest.xml: OK"

      - name: Verify AI request fix
        shell: bash
        run: |
          set -e

          FILE="app/src/main/java/com/toracokey/ai/ToracoKeyService.kt"

          test -f "$FILE"

          echo "Checking ToracoKeyService.kt..."

          grep -q "askBackendWithRetry(question)" "$FILE"

          echo "AI request fix found."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.37.3-AI-Request-Fixed
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
