name: Build ToracoKey AI v0.48.0 - Dictionary Dedup Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ToracoKeyAI_v0.48.0_DICTIONARY_DEDUP_FIX.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP not found: $ZIP"
            find . -maxdepth 2 -type f -iname '*.zip'
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          SETTINGS_FILE="$(find extracted -type f \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No Gradle settings file found in ZIP"
            find extracted -maxdepth 5 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Android app Gradle file not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug \
              --no-daemon --stacktrace
          else
            gradle :app:assembleDebug \
              --no-daemon --stacktrace
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated"
            find "$PROJECT_DIR/app/build/outputs" -type f || true
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.48.0-Dictionary-Dedup-Fix
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
