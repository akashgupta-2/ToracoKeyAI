name: Build ToracoKey AI v0.47.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Verify project and kill switches
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/toracokey/ai/DeviceControl.kt
          test -f app/src/main/java/com/toracokey/ai/ToracoKeyService.kt
          test -f app/src/main/java/com/toracokey/ai/KeyboardMode.kt
          test -f app/src/main/java/com/toracokey/ai/Calculator.kt
          test -f app/src/main/java/com/toracokey/ai/QuestionEngine.kt
          test -s app/src/main/assets/toracokey_words.tsv.gz
          test -f backend-policy-router.js

          grep -Fq 'versionName = "0.47.0"' app/build.gradle.kts
          grep -Fq 'versionCode = 58' app/build.gradle.kts
          grep -Fq 'const val APP_VERSION = "0.47.0"' \
            app/src/main/java/com/toracokey/ai/DeviceControl.kt

          grep -Fq 'typingEnabled' \
            app/src/main/java/com/toracokey/ai/DeviceControl.kt
          grep -Fq 'aiEnabled' \
            app/src/main/java/com/toracokey/ai/DeviceControl.kt
          grep -Fq 'typingEnabled' backend-policy-router.js
          grep -Fq 'aiEnabled' backend-policy-router.js

          echo "Project files, version and kill-switch checks passed."

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail
          gradle clean --no-daemon --stacktrace --console=plain

      - name: Compile Kotlin and report exact errors
        shell: bash
        run: |
          set -uo pipefail

          set +e
          gradle :app:compileDebugKotlin \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$RUNNER_TEMP/kotlin-build.log"
          result=${PIPESTATUS[0]}
          set -e

          echo
          echo "========== EXACT KOTLIN ERRORS =========="
          grep -n -E \
            '(^e: |\.kt:[0-9]+:[0-9]+|Unresolved reference|Type mismatch|Expecting )' \
            "$RUNNER_TEMP/kotlin-build.log" || true
          echo "========== END KOTLIN ERRORS =========="

          exit "$result"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --no-build-cache \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not generated."
            find app/build/outputs -type f -print || true
            exit 1
          fi

          ls -lh "$APK"
          echo "APK generated successfully."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.47.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
