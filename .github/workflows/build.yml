
name: Build ToracoKey AI v0.49.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify version and kill-switch
        run: |
          set -euo pipefail
          grep -Fq 'versionName = "0.49.0"' app/build.gradle.kts
          grep -Fq 'versionCode = 60' app/build.gradle.kts
          grep -Fq 'const val APP_VERSION = "0.49.0"' app/src/main/java/com/toracokey/ai/DeviceControl.kt
          grep -Fq 'typingEnabled' backend-policy-router.js
          grep -Fq 'aiEnabled' backend-policy-router.js
          grep -Fq 'if (!next.typingEnabled) next.aiEnabled = false' backend-policy-router.js
          echo "Version and kill-switch checks passed."

      - name: Clean project
        run: gradle clean --no-daemon --stacktrace --console=plain

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace --console=plain

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.49.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
