name: Build ToracoKey AI - Dimensions Final

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Java 17
      # ------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------
      # 3. Android SDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ------------------------------------------------------------
      # 4. Gradle
      # ------------------------------------------------------------
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      # ------------------------------------------------------------
      # 5. Show repository contents
      # ------------------------------------------------------------
      - name: Show repository structure
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "REPOSITORY CONTENTS"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -print \
            | sort

          echo
          echo "=========================================="
          echo "ZIP FILES"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -type f \
            \( -iname "*.zip" -o -iname "*.ZIP" \) \
            -print \
            | sort || true

      # ------------------------------------------------------------
      # 6. Extract the dimensions ZIP
      #
      # Expected ZIP:
      # ToracoKeyAI_v0.38.7_DIMENSIONS_FINAL.zip
      # ------------------------------------------------------------
      - name: Extract ToracoKey AI project
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for ToracoKey AI ZIP..."

          ZIP=""

          while IFS= read -r -d '' FILE; do
            NAME="$(basename "$FILE")"

            case "$NAME" in
              ToracoKeyAI_v0.38.7_DIMENSIONS_FINAL.zip)
                ZIP="$FILE"
                break
                ;;
            esac
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print0
          )

          if [ -z "$ZIP" ]; then
            echo
            echo "ERROR: ToracoKeyAI_v0.38.7_DIMENSIONS_FINAL.zip was not found."
            echo
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print || true
            exit 1
          fi

          echo
          echo "Using ZIP:"
          echo "$ZIP"
          echo

          rm -rf "$GITHUB_WORKSPACE/extracted"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo
          echo "ZIP extracted successfully."
          echo

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 4 \
            -type f \
            -print \
            | sort

      # ------------------------------------------------------------
      # 7. Locate Android Gradle project
      #
      # Supports:
      # extracted/settings.gradle.kts
      #
      # or:
      # extracted/some-folder/settings.gradle.kts
      # ------------------------------------------------------------
      - name: Locate Android Gradle project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/extracted"

          echo "Searching for Android Gradle project..."
          echo

          PROJECT=""

          # Direct project
          if [ \
            -f "$ROOT/settings.gradle.kts" ] && \
            [ -d "$ROOT/app" ] && \
            [ -f "$ROOT/app/build.gradle.kts" ]
          ]; then
            PROJECT="$ROOT"
          fi

          # Nested project
          if [ -z "$PROJECT" ]; then
            while IFS= read -r -d '' SETTINGS; do

              DIR="$(dirname "$SETTINGS")"

              if [ \
                -d "$DIR/app" ] && \
                [ -f "$DIR/app/build.gradle.kts" ]
              ]; then
                PROJECT="$DIR"
                break
              fi

            done < <(
              find "$ROOT" \
                -type f \
                -name "settings.gradle.kts" \
                -print0
            )
          fi

          if [ -z "$PROJECT" ]; then
            echo
            echo "ERROR: Android Gradle project could not be found."
            echo
            echo "settings.gradle.kts files:"
            find "$ROOT" \
              -type f \
              -name "settings.gradle.kts" \
              -print || true

            echo
            echo "app folders:"
            find "$ROOT" \
              -type d \
              -name "app" \
              -print || true

            echo
            echo "build.gradle.kts files:"
            find "$ROOT" \
              -type f \
              -name "build.gradle.kts" \
              -print || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo "ANDROID PROJECT FOUND"
          echo "=========================================="
          echo "$PROJECT"
          echo

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 8. Verify project
      # ------------------------------------------------------------
      - name: Verify Android project
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          echo "Project:"
          echo "$PROJECT"
          echo

          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/build.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -d "$PROJECT/app/src/main"

          echo "Required project files:"
          echo "OK settings.gradle.kts"
          echo "OK build.gradle.kts"
          echo "OK app/build.gradle.kts"
          echo "OK app/src/main"
          echo

          echo "Android plugin / version configuration:"
          grep -RniE \
            'com.android.application|versionCode|versionName' \
            "$PROJECT/settings.gradle.kts" \
            "$PROJECT/build.gradle.kts" \
            "$PROJECT/app/build.gradle.kts" \
            2>/dev/null || true

      # ------------------------------------------------------------
      # 9. Verify repositories
      # ------------------------------------------------------------
      - name: Verify Gradle repositories
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          echo "Repository declarations:"
          echo

          grep -RniE \
            'google\(\)|mavenCentral\(\)|gradlePluginPortal\(\)' \
            "$PROJECT/settings.gradle.kts" \
            "$PROJECT/build.gradle.kts" \
            "$PROJECT/app/build.gradle.kts" \
            2>/dev/null || true

      # ------------------------------------------------------------
      # 10. Check dimensions source exists
      # ------------------------------------------------------------
      - name: Verify keyboard source
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          echo "Checking ToracoKey source files..."
          echo

          find "$PROJECT/app/src/main" \
            -type f \
            -print \
            | sort

          echo
          echo "Checking for ToracoKeyService..."
          find "$PROJECT/app/src/main" \
            -type f \
            -name "ToracoKeyService.kt" \
            -print

          echo
          echo "Checking project source..."
          test -d "$PROJECT/app/src/main/java"

          echo "Source verification completed."

      # ------------------------------------------------------------
      # 11. Build debug APK
      # ------------------------------------------------------------
      - name: Build debug APK
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          cd "$PROJECT"

          echo
          echo "=========================================="
          echo "BUILDING TORACOKEY AI"
          echo "=========================================="
          echo

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            --no-build-cache

      # ------------------------------------------------------------
      # 12. Verify APK
      # ------------------------------------------------------------
      - name: Verify APK
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          echo
          echo "Checking APK..."
          echo

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            echo
            echo "Available build outputs:"
            find "$PROJECT/app/build" \
              -type f \
              -print \
              2>/dev/null || true
            exit 1
          fi

          echo "=========================================="
          echo "APK CREATED SUCCESSFULLY"
          echo "=========================================="
          echo

          ls -lh "$APK"

          echo
          echo "APK path:"
          echo "$APK"

      # ------------------------------------------------------------
      # 13. Upload APK
      # ------------------------------------------------------------
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.38.7-DIMENSIONS-FINAL
          path: ${{ steps.locate.outputs.project }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
