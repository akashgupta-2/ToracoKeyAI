name: Build ToracoKey AI v0.37.4 - Auth + Voice Fixed

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Extract ToracoKey AI project
        shell: bash
        run: |
          set -e

          ZIP_FILE="ToracoKeyAI_v0.37.4_AUTH_VOICE_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            echo ""
            echo "Files in repository:"
            ls -lah
            exit 1
          fi

          echo "Found:"
          ls -lh "$ZIP_FILE"

          rm -rf toracokey-build
          mkdir -p toracokey-build

          echo "Extracting project..."

          unzip -q "$ZIP_FILE" -d toracokey-build

          echo ""
          echo "Extracted files:"
          find toracokey-build -maxdepth 3 -type f | sort | head -200

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_SETTINGS=$(find "$GITHUB_WORKSPACE/toracokey-build" \
            -type f \
            -name "settings.gradle.kts" \
            -print \
            -quit)

          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts was not found after extracting ZIP."
            echo ""
            echo "ZIP contents:"
            find "$GITHUB_WORKSPACE/toracokey-build" -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PROJECT_SETTINGS")

          echo "Android project found:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          echo ""
          echo "Android project structure OK."

      - name: Check suggestion dictionary
        shell: bash
        run: |
          DICTIONARY="$PROJECT_ROOT/app/src/main/assets/toracokey_words.tsv.gz"

          if [ -f "$DICTIONARY" ]; then
            echo "Suggestion dictionary found:"
            ls -lh "$DICTIONARY"
          else
            echo "WARNING: Suggestion dictionary not found."
            echo "Continuing with build..."
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "Building ToracoKey AI..."
          echo "Project:"
          pwd

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"
          echo ""
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.37.4-Auth-Voice-Fixed-debug
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
