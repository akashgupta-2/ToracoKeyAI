name: Build ToracoKey AI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Show repository contents
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Repository contents"
          echo "=========================================="

          pwd

          echo
          find . -maxdepth 4 -type f | sort | head -n 500

      - name: Extract Android project ZIP if needed
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checking for Android project ZIP files"
          echo "=========================================="

          ZIP_FOUND=0

          while IFS= read -r -d '' ZIPFILE; do

            ZIP_FOUND=1

            echo
            echo "Found ZIP:"
            echo "$ZIPFILE"

            echo
            echo "ZIP contents:"
            unzip -l "$ZIPFILE" | head -n 80

            EXTRACT_DIR="$PWD/.toracokey-extracted"

            mkdir -p "$EXTRACT_DIR"

            echo
            echo "Extracting ZIP..."
            unzip -oq "$ZIPFILE" -d "$EXTRACT_DIR"

            echo "Extraction completed."

          done < <(
            find "$PWD" \
              -maxdepth 3 \
              -type f \
              -iname "*.zip" \
              -print0
          )

          if [ "$ZIP_FOUND" -eq 0 ]; then
            echo
            echo "No ZIP file found."
            echo "The repository may already contain the project directly."
          fi

          echo
          echo "Searching entire workspace after extraction..."

          find "$PWD" \
            -type f \
            \( \
              -name "settings.gradle.kts" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "AndroidManifest.xml" \
            \) \
            -print \
            2>/dev/null || true

      - name: Locate ToracoKey AI Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Searching for Android Gradle project"
          echo "=========================================="

          PROJECT=""

          while IFS= read -r -d '' SETTINGS; do

            DIR="$(dirname "$SETTINGS")"

            echo
            echo "Checking:"
            echo "$DIR"

            if [ -d "$DIR/app" ]; then

              if [ -f "$DIR/app/build.gradle.kts" ] || \
                 [ -f "$DIR/app/build.gradle" ]; then

                PROJECT="$DIR"

                echo
                echo "Android project found:"
                echo "$PROJECT"

                break
              fi

            fi

          done < <(
            find "$PWD" \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print0
          )

          if [ -z "$PROJECT" ]; then

            echo
            echo "=========================================="
            echo "ERROR: Android project not found"
            echo "=========================================="

            echo
            echo "Directories containing app:"
            find "$PWD" \
              -type d \
              -name "app" \
              -print \
              2>/dev/null || true

            echo
            echo "Gradle settings files:"
            find "$PWD" \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print \
              2>/dev/null || true

            echo
            echo "Gradle build files:"
            find "$PWD" \
              -type f \
              \( \
                -name "build.gradle.kts" \
                -o \
                -name "build.gradle" \
              \) \
              -print \
              2>/dev/null || true

            echo
            echo "All top-level workspace items:"
            find "$PWD" \
              -maxdepth 3 \
              -print \
              2>/dev/null | head -n 500

            exit 1
          fi

          echo
          echo "Project selected:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Verify project files
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Verifying Android project"
          echo "=========================================="

          echo
          echo "Project:"
          echo "$PROJECT"

          echo
          echo "Project files:"

          find "$PROJECT" \
            -maxdepth 4 \
            -type f \
            -print \
            | sort \
            | head -n 500

          echo

          if [ ! -f "$PROJECT/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT/settings.gradle" ]; then
            echo "ERROR: settings.gradle file missing."
            exit 1
          fi

          if [ ! -f "$PROJECT/build.gradle.kts" ] && \
             [ ! -f "$PROJECT/build.gradle" ]; then
            echo "ERROR: root build.gradle file missing."
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle file missing."
            exit 1
          fi

          if [ ! -d "$PROJECT/app/src/main" ]; then
            echo "ERROR: app/src/main directory missing."
            exit 1
          fi

          echo
          echo "Project verification successful."

      - name: Verify repositories
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checking Gradle repositories"
          echo "=========================================="

          echo

          if [ -f "$PROJECT/settings.gradle.kts" ]; then
            echo "settings.gradle.kts:"
            grep -nE \
              'google|mavenCentral|gradlePluginPortal|repositories' \
              "$PROJECT/settings.gradle.kts" \
              || true
          fi

          if [ -f "$PROJECT/settings.gradle" ]; then
            echo "settings.gradle:"
            grep -nE \
              'google|mavenCentral|gradlePluginPortal|repositories' \
              "$PROJECT/settings.gradle" \
              || true
          fi

          echo

          if [ -f "$PROJECT/build.gradle.kts" ]; then
            echo "build.gradle.kts:"
            grep -nE \
              'google|mavenCentral|gradlePluginPortal|repositories' \
              "$PROJECT/build.gradle.kts" \
              || true
          fi

          if [ -f "$PROJECT/build.gradle" ]; then
            echo "build.gradle:"
            grep -nE \
              'google|mavenCentral|gradlePluginPortal|repositories' \
              "$PROJECT/build.gradle" \
              || true
          fi

          echo
          echo "Repository check completed."

      - name: Build debug APK
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          cd "$PROJECT"

          echo "=========================================="
          echo "Building ToracoKey AI"
          echo "=========================================="

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            --no-build-cache

          echo
          echo "=========================================="
          echo "BUILD SUCCESSFUL"
          echo "=========================================="

      - name: Verify APK
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK:"
          echo "$APK"

          if [ ! -f "$APK" ]; then
            echo
            echo "ERROR: APK was not produced."

            echo
            echo "Available output files:"
            find "$PROJECT/app/build/outputs" \
              -type f \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo "APK FOUND"
          echo "=========================================="

          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-debug
          path: ${{ steps.locate.outputs.project }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
