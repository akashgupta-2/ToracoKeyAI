
      - name: Diagnose v0.45.0 sources
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "=== Project directory ==="
          pwd
          echo

          echo "=== Version configuration ==="
          grep -nE 'versionName|versionCode' app/build.gradle.kts || true
          echo

          echo "=== Required files ==="
          for f in \
            app/src/main/assets/toracokey_words.tsv.gz \
            app/src/main/java/com/toracokey/ai/DeviceControl.kt \
            app/src/main/java/com/toracokey/ai/KeyboardMode.kt \
            app/src/main/java/com/toracokey/ai/WordSuggestions.kt \
            app/src/main/java/com/toracokey/ai/VoiceInputActivity.kt \
            app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt
          do
            if [[ -s "$f" ]]; then
              echo "PASS: $f"
            else
              echo "FAIL: $f"
            fi
          done

          echo
          echo "=== Version checks ==="
          grep -nF '0.45.0' app/build.gradle.kts || true
          grep -nF '56' app/build.gradle.kts || true

          echo
          echo "=== Diagnostic complete ==="
