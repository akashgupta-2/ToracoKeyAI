
name: Build ToracoKey AI v0.49.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ToracoKeyAI_v0.49.0_Predictive_Typing.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Project ZIP not found: $ZIP"
            echo "ZIP files in repository:"
            find . -maxdepth 2 -type f -iname '*.zip'
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          echo "Extracted project files:"
          find extracted -maxdepth 3 -type f | head -60

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE=$(find extracted -type f \
            \( -path '*/app/build.gradle.kts' -o -path '*/app/build.gradle' \) \
            | head -n 1 || true)

          if [ -z "$APP_GRADLE" ]; then
            echo "::error::No Android app Gradle file found inside ZIP"
            find extracted -type f | head -100
            exit 1
          fi

          PROJECT_DIR="${APP_GRADLE%/app/build.gradle.kts}"
          PROJECT_DIR="${PROJECT_DIR%/app/build.gradle}"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "::error::Gradle settings file not found in $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Verify Android source
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          test -d app/src/main
          test -f app/src/main/AndroidManifest.xml
          echo "Android source files found."

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle clean --no-daemon --stacktrace

      - name: Compile Kotlin
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.49.0-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
