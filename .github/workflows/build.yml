name: Build ToracoKey AI - Dimensions Only

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure
        shell: bash
        run: |
          set -e
          echo "Repository:"
          pwd
          echo
          echo "Files:"
          find . -maxdepth 3 -type f -print | sort | head -300

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Extract ToracoKey AI project
        shell: bash
        run: |
          set -e

          echo "Looking for ToracoKey AI ZIP..."

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            echo
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -print | sort
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/extracted"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          echo
          echo "Extraction completed."
          echo
          echo "Extracted structure:"
          find "$GITHUB_WORKSPACE/extracted" -maxdepth 5 -type f -print | sort | head -500

      - name: Locate Android Gradle project
        id: locate
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/extracted"

          echo "Searching inside:"
          echo "$ROOT"
          echo

          SETTINGS_FILE="$(find "$ROOT" -type f -name 'settings.gradle.kts' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found."

            echo
            echo "All Gradle-related files:"
            find "$ROOT" \
              -type f \
              \( \
                -name 'settings.gradle*' \
                -o \
                -name 'build.gradle*' \
              \) \
              -print \
              | sort || true

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Android app folder was not found."

            echo
            echo "settings.gradle.kts:"
            echo "$SETTINGS_FILE"

            echo
            echo "Directories near project:"
            find "$PROJECT_DIR" -maxdepth 2 -type d -print | sort

            exit 1
          fi

          echo "ANDROID PROJECT FOUND"
          echo
          echo "Project directory:"
          echo "$PROJECT_DIR"
          echo
          echo "settings.gradle.kts:"
          echo "$PROJECT_DIR/settings.gradle.kts"
          echo
          echo "app directory:"
          echo "$PROJECT_DIR/app"

          echo "project=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify project files
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -e

          echo "Verifying:"
          echo "$PROJECT"
          echo

          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/build.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -d "$PROJECT/app/src/main"

          echo "All required Android project files are present."

          echo
          echo "Project contents:"
          find "$PROJECT/app/src/main" -maxdepth 4 -type f -print | sort | head -300

      - name: Verify Gradle repositories
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -e

          echo "Repository declarations:"
          echo

          grep -RniE \
            'google\(\)|mavenCentral\(\)|gradlePluginPortal\(\)' \
            "$PROJECT/settings.gradle.kts" \
            "$PROJECT/build.gradle.kts" \
            "$PROJECT/app/build.gradle.kts" \
            2>/dev/null || true

      - name: Clean previous build
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -e

          cd "$PROJECT"

          gradle \
            clean \
            --no-daemon \
            --stacktrace

      - name: Build debug APK
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -e

          cd "$PROJECT"

          echo "=========================================="
          echo "BUILDING TORACOKEY AI"
          echo "=========================================="
          echo

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            --no-build-cache

          echo
          echo "=========================================="
          echo "APK BUILD COMPLETED"
          echo "=========================================="

      - name: Verify APK
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -e

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK:"
          echo "$APK"

          if [ ! -f "$APK" ]; then
            echo
            echo "ERROR: APK was not created."

            echo
            echo "Available build outputs:"
            find "$PROJECT/app/build" \
              -type f \
              -print \
              2>/dev/null \
              | sort || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo "APK CREATED SUCCESSFULLY"
          echo "=========================================="
          echo

          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-Dimensions-Only-debug
          path: ${{ steps.locate.outputs.project }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
