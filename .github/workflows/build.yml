name: Build ToracoKey AI v0.37.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find and prepare Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # First check whether the project is already extracted.
          FOUND=$(find . \
            -type f \
            -name "settings.gradle.kts" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -n "$FOUND" ]; then
            PROJECT_DIR=$(dirname "$FOUND")
          fi

          # If the project is inside a ZIP, extract it.
          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE=$(find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print -quit)

            if [ -n "$ZIP_FILE" ]; then
              echo "Found project ZIP: $ZIP_FILE"

              mkdir -p extracted

              unzip -o "$ZIP_FILE" -d extracted

              FOUND=$(find extracted \
                -type f \
                -name "settings.gradle.kts" \
                -print -quit)

              if [ -n "$FOUND" ]; then
                PROJECT_DIR=$(dirname "$FOUND")
              fi
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "Repository contents:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            "$GITHUB_WORKSPACE/ToracoKeyAI-v0.37.1-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.37.1-debug
          path: ToracoKeyAI-v0.37.1-debug.apk
          if-no-files-found: error
