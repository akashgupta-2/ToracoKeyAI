name: Build ToracoKey AI v0.37.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================================
      # 2. JDK 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. Android SDK
      #
      # IMPORTANT:
      # Do NOT request the obsolete "tools" package.
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'


      # ============================================================
      # 4. Install required Android SDK packages
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # ============================================================
      # 5. Set up Gradle
      #
      # This project does NOT contain gradlew.
      # ============================================================
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true


      # ============================================================
      # 6. Verify exact project structure
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VERIFYING TORACOKEY AI PROJECT"
          echo "======================================"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo ""
          echo "Project verified:"
          pwd

          echo ""
          echo "Root files:"
          ls -lah


      # ============================================================
      # 7. Build APK
      # ============================================================
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING TORACOKEY AI"
          echo "======================================"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 8. Verify APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            echo ""
            echo "Build files:"
            find app/build -type f 2>/dev/null | sort || true
            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"


      # ============================================================
      # 9. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.37.3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
