name: Build ToracoKey AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          PROJECT_DIR=""

          # --------------------------------------------------
          # 1. Check repository root
          # --------------------------------------------------

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            PROJECT_DIR="."
            echo "Android project found in repository root."
          fi

          # --------------------------------------------------
          # 2. Search folders already extracted
          # --------------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then
            SETTINGS_FILE=$(find . \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -not -path "./.git/*" \
              -print -quit)

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
              echo "Android project found at:"
              echo "$PROJECT_DIR"
            fi
          fi

          # --------------------------------------------------
          # 3. If no project found, find the ToracoKey ZIP
          # --------------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then

            ZIP_FILE=""

            if [ -f "ToracoKeyAI_v0.37.3_GBoard_Number_Page_READY.zip" ]; then
              ZIP_FILE="ToracoKeyAI_v0.37.3_GBoard_Number_Page_READY.zip"
            fi

            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE=$(find . \
                -maxdepth 3 \
                -type f \
                -iname "*GBoard*Number*Page*.zip" \
                -print -quit)
            fi

            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE=$(find . \
                -maxdepth 3 \
                -type f \
                -iname "*.zip" \
                -print -quit)
            fi

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android project or ZIP file found."
              echo ""
              echo "Repository files:"
              find . -maxdepth 4 -type f -print
              exit 1
            fi

            echo "Using ZIP:"
            echo "$ZIP_FILE"

            rm -rf extracted-project
            mkdir -p extracted-project

            unzip -q "$ZIP_FILE" -d extracted-project

            echo "ZIP extracted."

            SETTINGS_FILE=$(find extracted-project \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print -quit)

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: Android project was not found inside ZIP."
              echo ""
              echo "Extracted files:"
              find extracted-project -maxdepth 6 -type f -print
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS_FILE")

            echo "Android project found inside ZIP:"
            echo "$PROJECT_DIR"
          fi

          # --------------------------------------------------
          # Save project path
          # --------------------------------------------------

          echo "$PROJECT_DIR" > android_project_path.txt

          echo ""
          echo "FINAL PROJECT DIRECTORY:"
          cat android_project_path.txt

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat android_project_path.txt)

          echo "Checking:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle" \
            || test -f "$PROJECT_DIR/settings.gradle.kts"

          test -d "$PROJECT_DIR/app"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo ""
          echo "Android project verified successfully."

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat android_project_path.txt)

          cd "$PROJECT_DIR"

          echo "Building from:"
          pwd

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat android_project_path.txt)

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          cp "$APK" ToracoKeyAI-GBoard-Number-Page-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.37.3-GBoard-Number-Page-debug
          path: ToracoKeyAI-GBoard-Number-Page-debug.apk
          if-no-files-found: error
