
name: Build ToracoKey AI v0.45.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Find v0.45.0 project source
        shell: bash
        run: |
          set -euo pipefail

          is_v045_project() {
            local d="$1"
            [[ -f "$d/settings.gradle.kts" &&
               -f "$d/build.gradle.kts" &&
               -f "$d/app/build.gradle.kts" &&
               -f "$d/app/src/main/AndroidManifest.xml" &&
               -f "$d/app/src/main/java/com/toracokey/ai/ToracoKeyService.kt" &&
               -f "$d/app/src/main/java/com/toracokey/ai/DeviceControl.kt" ]] || return 1

            grep -Fq 'versionName = "0.45.0"' "$d/app/build.gradle.kts" &&
            grep -Fq 'versionCode = 56' "$d/app/build.gradle.kts" &&
            grep -Fq 'VERTICAL' "$d/app/src/main/java/com/toracokey/ai/KeyboardMode.kt" &&
            grep -Fq 'STAIR' "$d/app/src/main/java/com/toracokey/ai/KeyboardMode.kt"
          }

          PROJECT_DIR=""

          if is_v045_project "$GITHUB_WORKSPACE"; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            EXTRACT_ROOT="$RUNNER_TEMP/toracokey-source"
            rm -rf "$EXTRACT_ROOT"
            mkdir -p "$EXTRACT_ROOT"

            while IFS= read -r -d '' archive; do
              dest="$EXTRACT_ROOT/$(basename "$archive" .zip)"
              mkdir -p "$dest"
              echo "Inspecting source archive: $archive"
              unzip -oq "$archive" -d "$dest"

              while IFS= read -r -d '' settings; do
                candidate="$(dirname "$settings")"
                if is_v045_project "$candidate"; then
                  PROJECT_DIR="$candidate"
                  break 2
                fi
              done < <(find "$dest" -type f -name settings.gradle.kts -print0)
            done < <(
              find "$GITHUB_WORKSPACE" -type f -iname 'ToracoKeyAI*.zip' \
                ! -path '*/.git/*' -print0
            )
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Could not find ToracoKey AI v0.45.0 / versionCode 56."
            echo "Commit the project at repository root or add its source ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using source: $PROJECT_DIR"

      - name: Fix Kotlin whitespace compatibility issue
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$PROJECT_DIR/app/src/main/java/com/toracokey/ai/ToracoKeyService.kt"
          test -f "$SOURCE"

          python3 - "$SOURCE" <<'PYFIX'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()

          old = "value.any { it.isWhitespace() }"
          new = r"value.any { it == ' ' || it == '\t' || it == '\n' || it == '\r' }"

          if old in source:
              source = source.replace(old, new, 1)
              path.write_text(source)
              print("Applied Kotlin whitespace compatibility fix.")
          elif new in source:
              print("Kotlin whitespace compatibility fix is already present.")
          else:
              raise SystemExit(
                  "Expected whitespace expression was not found; "
                  "refusing to modify unrelated source."
              )
          PYFIX

      - name: Verify release sources and kill switch
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -s app/src/main/assets/toracokey_words.tsv.gz
          test -f app/src/main/java/com/toracokey/ai/WordSuggestions.kt
          test -f app/src/main/java/com/toracokey/ai/VoiceInputActivity.kt
          test -f app/src/main/java/com/toracokey/ai/QuestionEngine.kt
          test -f backend-policy-router.js

          grep -Fq 'typingEnabled' app/src/main/java/com/toracokey/ai/DeviceControl.kt
          grep -Fq 'aiEnabled' app/src/main/java/com/toracokey/ai/DeviceControl.kt
          grep -Fq 'minimumAppVersion' app/src/main/java/com/toracokey/ai/DeviceControl.kt
          grep -Fq 'typingEnabled' backend-policy-router.js
          grep -Fq 'aiEnabled' backend-policy-router.js
          grep -Fq 'router.patch' backend-policy-router.js

          grep -Fq "value.any { it == ' ' || it == '\\t' || it == '\\n' || it == '\\r' }" \
            app/src/main/java/com/toracokey/ai/ToracoKeyService.kt

          echo "Version, typing modes, policy controls, and kill-switch checks passed."

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean --no-daemon --stacktrace --console=plain

      - name: Compile Kotlin and print exact errors
        shell: bash
        run: |
          set -uo pipefail
          cd "$PROJECT_DIR"

          set +e
          gradle :app:compileDebugKotlin \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "$RUNNER_TEMP/kotlin-build.log"
          RESULT=${PIPESTATUS[0]}
          set -e

          echo
          echo "========== EXACT KOTLIN ERRORS =========="
          grep -n -E \
            '(^e: |\.kt:[0-9]+:[0-9]+|^.* error:|Unresolved reference|Type mismatch|Expecting )' \
            "$RUNNER_TEMP/kotlin-build.log" || true
          echo "========== END KOTLIN ERRORS =========="

          exit "$RESULT"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f -print 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.45.0-remote-policy-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
