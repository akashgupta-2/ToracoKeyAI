
name: Build ToracoKey AI v0.45.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate ToracoKey v0.45.0
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          # Prefer the uploaded source ZIP when present.
          while IFS= read -r -d '' archive; do
            dest="$RUNNER_TEMP/toracokey-source/$(basename "$archive" .zip)"
            mkdir -p "$dest"
            unzip -oq "$archive" -d "$dest"

            while IFS= read -r -d '' settings; do
              candidate="$(dirname "$settings")"

              if [[ -f "$candidate/app/build.gradle.kts" ]] &&
                 grep -Fq 'versionName = "0.45.0"' \
                   "$candidate/app/build.gradle.kts"; then
                PROJECT_DIR="$candidate"
                break 2
              fi
            done < <(find "$dest" -name settings.gradle.kts -print0)
          done < <(
            find "$GITHUB_WORKSPACE" -type f -iname '*.zip' \
              ! -path '*/.git/*' -print0
          )

          # Otherwise use the checked-out project.
          if [[ -z "$PROJECT_DIR" ]] &&
             [[ -f "$GITHUB_WORKSPACE/app/build.gradle.kts" ]] &&
             grep -Fq 'versionName = "0.45.0"' \
               "$GITHUB_WORKSPACE/app/build.gradle.kts"; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::ToracoKey AI v0.45.0 source not found."
            echo "Commit the source ZIP or the project files."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Selected source: $PROJECT_DIR"

      - name: Verify source and kill-switch controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -Fq 'versionName = "0.45.0"' app/build.gradle.kts
          grep -Fq 'versionCode = 56' app/build.gradle.kts

          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/toracokey/ai/DeviceControl.kt
          test -f app/src/main/java/com/toracokey/ai/KeyboardMode.kt
          test -f app/src/main/java/com/toracokey/ai/ToracoKeyService.kt
          test -f app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          grep -Fq 'typingEnabled' \
            app/src/main/java/com/toracokey/ai/DeviceControl.kt
          grep -Fq 'aiEnabled' \
            app/src/main/java/com/toracokey/ai/DeviceControl.kt

          grep -Fq 'VERTICAL' \
            app/src/main/java/com/toracokey/ai/KeyboardMode.kt
          grep -Fq 'STAIR' \
            app/src/main/java/com/toracokey/ai/KeyboardMode.kt

          echo "Source and kill-switch checks passed."

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean --no-daemon --console=plain

      - name: Compile Kotlin and report errors
        shell: bash
        run: |
          set -uo pipefail
          cd "$PROJECT_DIR"

          set +e
          gradle :app:compileDebugKotlin \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "$RUNNER_TEMP/kotlin-build.log"

          RESULT=${PIPESTATUS[0]}
          set -e

          echo
          echo "========== EXACT KOTLIN ERRORS =========="

          grep -n -E \
            '(^e: |\.kt:[0-9]+:[0-9]+|Unresolved reference|Type mismatch|Expecting )' \
            "$RUNNER_TEMP/kotlin-build.log" || true

          echo "========== END KOTLIN ERRORS =========="

          exit "$RESULT"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.45.0-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
