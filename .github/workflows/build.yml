name: Build ToracoKey AI v0.37.4 - Auth + Voice Fixed

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Verify project structure
        run: |
          echo "Checking ToracoKey AI project..."
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/toracokey_words.tsv.gz
          echo "Project structure OK"

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.37.4-Auth-Voice-Fixed-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
