name: Build ToracoKey AI v0.47.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Find ToracoKey Android project
        shell: bash
        run: |
          set -euo pipefail

          is_project() {
            local d="$1"

            [[ -f "$d/settings.gradle.kts" &&
               -f "$d/build.gradle.kts" &&
               -f "$d/app/build.gradle.kts" &&
               -f "$d/app/src/main/AndroidManifest.xml" &&
               -f "$d/app/src/main/java/com/toracokey/ai/ToracoKeyService.kt" &&
               -f "$d/app/src/main/java/com/toracokey/ai/DeviceControl.kt" ]]
          }

          PROJECT_DIR=""

          # First search the checked-out repository, including nested folders.
          while IFS= read -r -d '' settings; do
            candidate="$(dirname "$settings")"
            if is_project "$candidate"; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type d -name .git -prune -o \
              -type f -name settings.gradle.kts -print0
          )

          # If the source is stored in a ZIP, extract and search its contents.
          if [[ -z "$PROJECT_DIR" ]]; then
            EXTRACT_ROOT="$RUNNER_TEMP/toracokey-extracted"
            mkdir -p "$EXTRACT_ROOT"

            archive_count=0

            while IFS= read -r -d '' archive; do
              archive_count=$((archive_count + 1))
              destination="$EXTRACT_ROOT/archive-$archive_count"
              mkdir -p "$destination"

              echo "Extracting: $archive"
              unzip -oq "$archive" -d "$destination"

              while IFS= read -r -d '' settings; do
                candidate="$(dirname "$settings")"

                if is_project "$candidate"; then
                  PROJECT_DIR="$candidate"
                  break 2
                fi
              done < <(
                find "$destination" \
                  -type f -name settings.gradle.kts -print0
              )
            done < <(
              find "$GITHUB_WORKSPACE" \
                -type d -name .git -prune -o \
                -type f -iname '*.zip' -print0
            )
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Android project not found."
            echo "Ensure the repository contains the project or its source ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Verify project version and kill switches
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          SOURCE="app/src/main/java/com/toracokey/ai/ToracoKeyService.kt"
          CONTROL="app/src/main/java/com/toracokey/ai/DeviceControl.kt"

          test -s "$SOURCE"
          test -s "$CONTROL"

          echo "Checking version configuration..."

          grep -Fq 'versionName = "0.47.0"' app/build.gradle.kts
          grep -Fq 'versionCode = 58' app/build.gradle.kts

          echo "Checking typing and AI kill-switch declarations..."

          grep -Fq 'typingEnabled' "$CONTROL"
          grep -Fq 'aiEnabled' "$CONTROL"

          echo "Version and kill-switch declarations verified."

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean --no-daemon --console=plain

      - name: Compile Kotlin and report exact errors
        shell: bash
        run: |
          set -uo pipefail
          cd "$PROJECT_DIR"

          set +e
          gradle :app:compileDebugKotlin \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$RUNNER_TEMP/kotlin-build.log"
          RESULT=${PIPESTATUS[0]}
          set -e

          echo
          echo "========== KOTLIN ERRORS =========="
          grep -n -E \
            '(^e: |\.kt:[0-9]+:[0-9]+|Unresolved reference|Type mismatch|Expecting )' \
            "$RUNNER_TEMP/kotlin-build.log" || true
          echo "========== END ERRORS =========="

          exit "$RESULT"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --no-build-cache \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" \
              -type f -print 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK"
          echo "APK generated successfully."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.47.0-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
