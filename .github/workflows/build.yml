name: Build ToracoKey AI v0.37.9

on:
  workflow_dispatch:
  push:
    paths:
      - "ToracoKeyAI_v0.37.9_GBOARD_GEOMETRY_TOUCH.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Extract ToracoKey AI source ZIP
        shell: bash
        run: |
          set -e

          ZIP="ToracoKeyAI_v0.37.9_GBOARD_GEOMETRY_TOUCH.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            exit 1
          fi

          rm -rf toracokey-source
          mkdir -p toracokey-source

          unzip -q "$ZIP" -d toracokey-source

          echo "ZIP extracted successfully."

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find toracokey-source \
            -type f \
            -name "settings.gradle.kts" \
            -not -path "*/.git/*" \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found inside ZIP"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Verify keyboard source
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/app/src/main/java/com/toracokey/ai/ToracoKeyService.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/toracokey/ai/WordSuggestions.kt"
          test -f "$PROJECT_DIR/app/src/main/assets/toracokey_words.tsv.gz"

          echo "ToracoKey source files verified."

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.37.9-GBOARD-GEOMETRY-TOUCH-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
