name: Build ToracoKey AI v0.48.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository contents
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 4. Install the Gradle version required by this project
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      # 5. Extract the actual Android source project
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ToracoKeyAI_v0.48.0_DICTIONARY_AI_CLEANUP.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Project ZIP not found: $ZIP"
            echo "ZIP files in repository:"
            find . -maxdepth 2 -type f -iname '*.zip'
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          SETTINGS_FILE="$(find extracted -type f \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file not found in ZIP."
            find extracted -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/build.gradle.kts" ] &&
             [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "::error::Root Gradle build file is missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Android app Gradle file is missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project directory: $PROJECT_DIR"
          echo "Project files verified."

      # 6. Check project version and required source files
      - name: Verify ToracoKey project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -Fq 'versionName = "0.48.0"' app/build.gradle.kts
          grep -Fq 'versionCode = 59' app/build.gradle.kts

          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/toracokey/ai/WordSuggestions.kt
          test -f app/src/main/assets/toracokey_words.tsv.gz
          test -f app/src/main/assets/gboard_shortcuts.tsv

          echo "Version and dictionary asset checks passed."

      # 7. Clean previous build outputs
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean --no-daemon --stacktrace --console=plain

      # 8. Compile Kotlin and show useful errors if it fails
      - name: Compile Kotlin
        shell: bash
        run: |
          set +e
          cd "$PROJECT_DIR"

          gradle :app:compileDebugKotlin \
            --no-daemon \
            --stacktrace \
            --console=plain 2>&1 | tee "$RUNNER_TEMP/kotlin-build.log"

          RESULT=${PIPESTATUS[0]}

          echo "========== COMPILER ERRORS =========="
          grep -n -E \
            '(^e: |\.kt:[0-9]+:[0-9]+|Unresolved reference|Type mismatch|Expecting )' \
            "$RUNNER_TEMP/kotlin-build.log" || true
          echo "========== END COMPILER ERRORS =========="

          exit "$RESULT"

      # 9. Build the APK
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      # 10. Verify generated APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Debug APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK"

      # 11. Publish APK as a downloadable artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.48.0-Dictionary-Update
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
