name: Build ToracoKey AI v0.38.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Verify ToracoKey AI project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties

          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt
          test -f app/src/main/java/com/toracokey/ai/ToracoKeyService.kt
          test -f app/src/main/java/com/toracokey/ai/WordSuggestions.kt

          test -s app/src/main/assets/toracokey_words.tsv.gz

          grep -Fq 'versionCode = 48' app/build.gradle.kts
          grep -Fq 'versionName = "0.38.2"' app/build.gradle.kts

          echo "ToracoKey AI v0.38.2 source verified."

      - name: Verify keyboard geometry
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'private val rowHeight = dp(60)' \
            app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          grep -Fq 'dp(16)' \
            app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          grep -Fq 'setMargins(dp(3), dp(2), dp(3), dp(2))' \
            app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          grep -Fq 'dp(44)' \
            app/src/main/java/com/toracokey/ai/ToracoKeyService.kt

          echo "Keyboard geometry verified."

      - name: Verify black-to-grey theme
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'Color.BLACK' \
            app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          grep -Fq 'Color.rgb(92, 95, 100)' \
            app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          grep -Fq 'GradientDrawable.Orientation.TOP_BOTTOM' \
            app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          echo "Grey-top / black-bottom theme verified."

      - name: Verify unique suggestions
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'suggestionFamily' \
            app/src/main/java/com/toracokey/ai/WordSuggestions.kt

          grep -Fq 'distinctBy { it.lowercase(Locale.ROOT) }' \
            app/src/main/java/com/toracokey/ai/ToracoKeyService.kt

          echo "Unique suggestion filtering verified."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          test -f app/build/outputs/apk/debug/app-debug.apk

          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.38.2-GBoard-Black-Unique-Suggestions-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
