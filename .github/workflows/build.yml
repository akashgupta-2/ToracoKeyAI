
name: Build ToracoKey AI v0.45.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          # Prefer the v0.45.0 source archive if present.
          while IFS= read -r -d '' zipfile; do
            dest="$RUNNER_TEMP/toracokey-source/$(basename "$zipfile" .zip)"
            mkdir -p "$dest"
            unzip -oq "$zipfile" -d "$dest"

            while IFS= read -r -d '' gradlefile; do
              candidate="$(dirname "$gradlefile")"

              if [[ -f "$candidate/app/build.gradle.kts" ]] &&
                 grep -Fq 'versionName = "0.45.0"' \
                   "$candidate/app/build.gradle.kts"; then
                PROJECT_DIR="$candidate"
                break 2
              fi
            done < <(find "$dest" -name settings.gradle.kts -print0)
          done < <(
            find "$GITHUB_WORKSPACE" -type f -iname '*.zip' \
              ! -path '*/.git/*' -print0
          )

          # Fall back to the checked-out source tree.
          if [[ -z "$PROJECT_DIR" ]] &&
             [[ -f app/build.gradle.kts ]] &&
             grep -Fq 'versionName = "0.45.0"' app/build.gradle.kts; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Cannot locate ToracoKey AI v0.45.0 source."
            echo "Commit the source ZIP or update the version check."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Selected source: $PROJECT_DIR"

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          grep -F 'versionName' app/build.gradle.kts
          grep -F 'versionCode' app/build.gradle.kts

      - name: Clean project
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle clean --no-daemon --console=plain

      - name: Compile Kotlin and print exact errors
        shell: bash
        run: |
          set -uo pipefail
          cd "$PROJECT_DIR"

          set +e
          gradle :app:compileDebugKotlin \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "$RUNNER_TEMP/kotlin-build.log"

          RESULT=${PIPESTATUS[0]}
          set -e

          echo
          echo "========== EXACT KOTLIN ERRORS =========="

          grep -n -E \
            '(^e: |\.kt:[0-9]+:[0-9]+|^.* error:|Unresolved reference|Type mismatch|Expecting )' \
            "$RUNNER_TEMP/kotlin-build.log" || true

          echo "========== END KOTLIN ERRORS =========="

          exit "$RESULT"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.45.0-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
