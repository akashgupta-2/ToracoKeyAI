
name: Build ToracoKey AI v0.49.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE=$(find . -type f -path '*/app/build.gradle.kts' -not -path '*/build/*' | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::Could not find app/build.gradle.kts"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="${GRADLE_FILE%/app/build.gradle.kts}"
          [ -n "$PROJECT_DIR" ] || PROJECT_DIR="."

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::settings.gradle.kts not found in $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify version and kill-switch
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'versionName = "0.49.0"' app/build.gradle.kts
          grep -Fq 'versionCode = 60' app/build.gradle.kts
          grep -Fq 'const val APP_VERSION = "0.49.0"' app/src/main/java/com/toracokey/ai/DeviceControl.kt
          grep -Fq 'typingEnabled' backend-policy-router.js
          grep -Fq 'aiEnabled' backend-policy-router.js

          echo "Version and kill-switch checks passed."

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle clean --no-daemon --stacktrace --console=plain

      - name: Compile Kotlin
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace --console=plain

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.49.0-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
