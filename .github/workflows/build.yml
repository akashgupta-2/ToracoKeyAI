name: Build ToracoKey AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q ToracoKeyAI_v0.1.zip -d extracted

      - name: Enable AndroidX
        working-directory: extracted
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fix JVM target
        working-directory: extracted
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              "android {\n",
              """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """,
              1
          )

          s += """

          kotlin {
              jvmToolchain(17)
          }
          """

          p.write_text(s)
          PY

      - name: Build APK
        working-directory: extracted
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-debug
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
