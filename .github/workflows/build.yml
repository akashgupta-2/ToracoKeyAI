name: Build ToracoKey AI v0.17 Voice Insert Fix 2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check v0.17 ZIP
        run: |
          test -f ToracoKeyAI_v0.17_Voice_InsertFix2.zip
          echo "Found v0.17 Voice Insert Fix 2 ZIP"

      - name: Extract v0.17 ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q ToracoKeyAI_v0.17_Voice_InsertFix2.zip -d extracted
          test -f extracted/v017/settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        working-directory: extracted/v017
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.17-Voice-InsertFix2
          path: extracted/v017/app/build/outputs/apk/debug/app-debug.apk
