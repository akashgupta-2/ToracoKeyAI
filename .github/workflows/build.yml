name: Build ToracoKey AI v0.21

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check v0.21 ZIP
        run: |
          test -f ToracoKeyAI_v0.21_SpecialTyping_SafeUI_FINAL.zip
          echo "Found v0.21 ZIP"

      - name: Extract v0.21 ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q ToracoKeyAI_v0.21_SpecialTyping_SafeUI_FINAL.zip -d extracted
          test -f extracted/settings.gradle.kts
          echo "v0.21 project extracted successfully"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        working-directory: extracted
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.21-debug
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
