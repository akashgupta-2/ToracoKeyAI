name: Build ToracoKey AI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Show repository structure
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Repository structure"
          echo "=========================================="

          pwd

          echo
          echo "Top-level files:"
          find . -maxdepth 3 -type f | sort | head -n 300

          echo
          echo "Gradle settings files:"
          find . \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print

          echo
          echo "Build files:"
          find . \
            -type f \
            \( -name "build.gradle.kts" -o -name "build.gradle" \) \
            -print

      - name: Locate ToracoKey AI Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Android Gradle project..."

          PROJECT=""

          # ----------------------------------------------------
          # Case 1: Repository root is the Android project
          # ----------------------------------------------------

          if [ -d "app" ] && \
             { [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; }; then

            PROJECT="$PWD"

          fi

          # ----------------------------------------------------
          # Case 2: Android project is inside a subdirectory
          # ----------------------------------------------------

          if [ -z "$PROJECT" ]; then

            while IFS= read -r -d '' SETTINGS; do

              DIR="$(dirname "$SETTINGS")"

              if [ -d "$DIR/app" ]; then
                PROJECT="$DIR"
                break
              fi

            done < <(
              find "$PWD" \
                -type f \
                \( \
                  -name "settings.gradle.kts" \
                  -o \
                  -name "settings.gradle" \
                \) \
                -print0
            )

          fi

          # ----------------------------------------------------
          # Final validation
          # ----------------------------------------------------

          if [ -z "$PROJECT" ]; then

            echo
            echo "ERROR: Could not locate an Android Gradle project."
            echo

            echo "Directories containing an app folder:"
            find "$PWD" \
              -type d \
              -name "app" \
              -print \
              2>/dev/null || true

            echo
            echo "Gradle settings files found:"
            find "$PWD" \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print \
              2>/dev/null || true

            echo
            echo "Gradle build files found:"
            find "$PWD" \
              -type f \
              \( \
                -name "build.gradle.kts" \
                -o \
                -name "build.gradle" \
              \) \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo "Android project found"
          echo "=========================================="
          echo "$PROJECT"

          echo
          echo "Project contents:"
          find "$PROJECT" -maxdepth 3 -type f | sort | head -n 300

          echo
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Verify project files
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          echo "Checking project:"
          echo "$PROJECT"

          echo

          if [ ! -f "$PROJECT/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT/settings.gradle" ]; then
            echo "ERROR: settings.gradle file not found."
            exit 1
          fi

          if [ ! -f "$PROJECT/build.gradle.kts" ] && \
             [ ! -f "$PROJECT/build.gradle" ]; then
            echo "ERROR: root build.gradle file not found."
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle file not found."
            exit 1
          fi

          if [ ! -d "$PROJECT/app/src/main" ]; then
            echo "ERROR: app/src/main directory not found."
            exit 1
          fi

          echo "=========================================="
          echo "Project verification successful"
          echo "=========================================="

          echo
          echo "Settings:"
          if [ -f "$PROJECT/settings.gradle.kts" ]; then
            sed -n '1,200p' "$PROJECT/settings.gradle.kts"
          else
            sed -n '1,200p' "$PROJECT/settings.gradle"
          fi

          echo
          echo "App Gradle file:"
          if [ -f "$PROJECT/app/build.gradle.kts" ]; then
            sed -n '1,240p' "$PROJECT/app/build.gradle.kts"
          else
            sed -n '1,240p' "$PROJECT/app/build.gradle"
          fi

      - name: Verify repositories
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          echo "Checking repository configuration..."

          echo
          echo "settings.gradle:"
          if [ -f "$PROJECT/settings.gradle.kts" ]; then
            grep -nE \
              'google|mavenCentral|gradlePluginPortal|repositories' \
              "$PROJECT/settings.gradle.kts" \
              || true
          else
            grep -nE \
              'google|mavenCentral|gradlePluginPortal|repositories' \
              "$PROJECT/settings.gradle" \
              || true
          fi

          echo
          echo "root build.gradle:"
          if [ -f "$PROJECT/build.gradle.kts" ]; then
            grep -nE \
              'google|mavenCentral|gradlePluginPortal|repositories' \
              "$PROJECT/build.gradle.kts" \
              || true
          else
            grep -nE \
              'google|mavenCentral|gradlePluginPortal|repositories' \
              "$PROJECT/build.gradle" \
              || true
          fi

          echo
          echo "Repository verification completed."

      - name: Build debug APK
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          cd "$PROJECT"

          echo
          echo "=========================================="
          echo "Building ToracoKey AI"
          echo "=========================================="

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            --no-build-cache

          echo
          echo "=========================================="
          echo "Build completed"
          echo "=========================================="

      - name: Verify APK
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          echo "Looking for APK:"
          echo "$APK"

          if [ ! -f "$APK" ]; then
            echo
            echo "ERROR: APK was not produced."

            echo
            echo "Available output files:"
            find "$PROJECT/app/build/outputs" \
              -type f \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo "APK successfully created"
          echo "=========================================="

          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-debug
          path: ${{ steps.locate.outputs.project }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
