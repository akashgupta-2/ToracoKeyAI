name: Build ToracoKey V5.7

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract ToracoKey ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f \
            \( -iname 'ToracoKey*.zip' -o -iname 'toraco-key*.zip' -o -iname '*.zip' \) \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ToracoKey ZIP found"
            ls -la
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No Gradle project found"
            find extracted -type f | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Gradle project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ToracoKey V5.7
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/ToracoKey-V5.7.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKey-V5.7-APK
          path: ToracoKey-V5.7.apk
