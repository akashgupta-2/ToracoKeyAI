name: Build ToracoKey AI v0.37.9

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Extract ToracoKey AI ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="ToracoKeyAI_v0.37.9_GBOARD_GEOMETRY_TOUCH.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found:"
            echo "$ZIP_FILE"
            echo
            echo "Files in repository root:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          rm -rf toracokey-source
          mkdir -p toracokey-source

          unzip -q "$ZIP_FILE" -d toracokey-source

          echo "ZIP extracted successfully."

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/toracokey-source" \
            -type f \
            -name "settings.gradle.kts" \
            -not -path "*/.git/*" \
            -print -quit)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts was not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_DIR")"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking project:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Required Android project files found."

      - name: Verify keyboard source
        shell: bash
        run: |
          set -euo pipefail

          SERVICE_FILE="$(find "$PROJECT_DIR/app/src/main" \
            -type f \
            -name "ToracoKeyService.kt" \
            -not -path "*/.git/*" \
            -print -quit)"

          if [ -z "$SERVICE_FILE" ]; then
            echo "ERROR: ToracoKeyService.kt not found."
            exit 1
          fi

          echo "Keyboard service found:"
          echo "$SERVICE_FILE"

      - name: Verify GBoard-like keyboard source
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android source files..."

          SOURCE_COUNT="$(find "$PROJECT_DIR/app/src/main" \
            -type f \
            \( -name "*.kt" -o -name "*.xml" \) \
            -not -path "*/.git/*" \
            | wc -l)"

          if [ "$SOURCE_COUNT" -lt 1 ]; then
            echo "ERROR: No Android Kotlin/XML source files found."
            exit 1
          fi

          echo "Android source files found: $SOURCE_COUNT"

      - name: Verify suggestion dictionary
        shell: bash
        run: |
          set -euo pipefail

          DICT="$(find "$PROJECT_DIR/app/src/main/assets" \
            -type f \
            \( -name "*.gz" -o -name "*.tsv" -o -name "*.txt" \) \
            -not -path "*/.git/*" \
            -print -quit 2>/dev/null || true)"

          if [ -z "$DICT" ]; then
            echo "WARNING: No suggestion dictionary found."
            echo "Continuing because the Android project itself is still buildable."
          else
            echo "Suggestion dictionary found:"
            echo "$DICT"
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not created."
            exit 1
          fi

          echo "APK created successfully:"
          echo "$APK"

          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.37.9-GBoard-Geometry-Touch-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
