name: Build ToracoKey AI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository contents:"
          find . -maxdepth 4 -type f | sort | head -300

          PROJECT_DIR=""

          # 1. Check whether the Android project is already at repository root.
          if [ -f "./settings.gradle.kts" ] && [ -d "./app" ]; then
            PROJECT_DIR="."
          elif [ -f "./settings.gradle" ] && [ -d "./app" ]; then
            PROJECT_DIR="."
          fi

          # 2. If not, search for an Android project already inside a folder.
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -not -path "./.git/*" \
              -not -path "./_android_project/*" \
              -print0 | while IFS= read -r -d '' file; do
                dir=$(dirname "$file")
                if [ -d "$dir/app" ]; then
                  echo "$dir"
                  break
                fi
              done)
          fi

          # 3. If the project is not extracted, find the ToracoKey ZIP.
          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE=$(find . \
              -type f \
              -iname "ToracoKeyAI*.zip" \
              -not -path "./.git/*" \
              -print -quit)

            if [ -n "$ZIP_FILE" ]; then
              echo "Found ZIP: $ZIP_FILE"

              rm -rf _android_project
              mkdir -p _android_project

              unzip -q "$ZIP_FILE" -d _android_project

              echo "ZIP extracted."

              PROJECT_DIR=$(find ./_android_project \
                -type f \
                \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
                -not -path "*/.git/*" \
                -print0 | while IFS= read -r -d '' file; do
                  dir=$(dirname "$file")
                  if [ -d "$dir/app" ]; then
                    echo "$dir"
                    break
                  fi
                done)
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Could not locate the ToracoKey Android project."
            echo "Expected settings.gradle(.kts) together with an app directory."
            exit 1
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "========================================"
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"
          echo "========================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking:"
          echo "$PROJECT_DIR"

          test -d "$PROJECT_DIR/app"

          if [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Found settings.gradle.kts"
          elif [ -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "Found settings.gradle"
          else
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          test -f "$PROJECT_DIR/app/build.gradle.kts" \
            || test -f "$PROJECT_DIR/app/build.gradle"

          echo "Android project structure OK."

      - name: Show project files
        shell: bash
        run: |
          echo "Project:"
          find "$PROJECT_DIR" -maxdepth 4 -type f \
            -not -path "*/build/*" \
            -not -path "*/.gradle/*" \
            | sort | head -300

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK generated:"
          echo "$APK"

          ls -lh "$APK"

          echo "APK verification successful."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-debug
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/*.apk
          if-no-files-found: error
