name: Build ToracoKey AI v0.37.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout project
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================================
      # 2. Java 17
      # IMPORTANT:
      # No Gradle cache here because this project has no gradlew
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. Install Android SDK packages required by this project
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================================
      # 5. Install Gradle 8.11.1
      #
      # This project does NOT contain gradlew.
      # Therefore we use the installed Gradle command directly.
      # ============================================================
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true


      # ============================================================
      # 6. Verify the exact ToracoKey AI project
      # ============================================================
      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "CHECKING TORACOKEY AI PROJECT"
          echo "======================================"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          test -d app/src/main/java/com/toracokey/ai

          echo ""
          echo "Project root:"
          pwd

          echo ""
          echo "Project files:"
          ls -lah

          echo ""
          echo "Android app:"
          ls -lah app

          echo ""
          echo "Project structure verified successfully."


      # ============================================================
      # 7. Build debug APK
      # ============================================================
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING TORACOKEY AI APK"
          echo "======================================"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Gradle build completed."


      # ============================================================
      # 8. Verify APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "======================================"
          echo "VERIFYING APK"
          echo "======================================"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            echo ""
            echo "Available build files:"
            find app/build -type f 2>/dev/null | sort || true
            exit 1
          fi

          echo ""
          echo "APK BUILD SUCCESSFUL"
          echo ""

          ls -lh "$APK"


      # ============================================================
      # 9. Upload APK
      # ============================================================
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.37.3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
