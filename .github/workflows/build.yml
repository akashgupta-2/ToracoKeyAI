
name: Build ToracoKey AI v0.45.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          if [[ ! -d "$ANDROID_HOME" ]]; then
            echo "::error::Android SDK directory not found."
            exit 1
          fi

          echo "Installed SDK platforms:"
          ls -1 "$ANDROID_HOME/platforms" 2>/dev/null || true

          echo "Installed build tools:"
          ls -1 "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find ToracoKey project
        shell: bash
        run: |
          set -euo pipefail

          is_project() {
            local d="$1"

            [[ -f "$d/settings.gradle.kts" &&
               -f "$d/app/build.gradle.kts" &&
               -f "$d/app/src/main/AndroidManifest.xml" &&
               -f "$d/app/src/main/java/com/toracokey/ai/DeviceControl.kt" &&
               -f "$d/app/src/main/java/com/toracokey/ai/KeyboardMode.kt" &&
               -f "$d/app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt" ]]
          }

          PROJECT_DIR=""

          if is_project "$GITHUB_WORKSPACE"; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            EXTRACT_ROOT="$RUNNER_TEMP/toracokey-extracted"
            mkdir -p "$EXTRACT_ROOT"

            while IFS= read -r -d '' archive; do
              echo "Extracting: $archive"

              dest="$EXTRACT_ROOT/$(basename "$archive" .zip)"
              mkdir -p "$dest"
              unzip -oq "$archive" -d "$dest"

              while IFS= read -r -d '' settings; do
                candidate="$(dirname "$settings")"

                if is_project "$candidate"; then
                  PROJECT_DIR="$candidate"
                  break 2
                fi
              done < <(
                find "$dest" -type f \
                  -name settings.gradle.kts -print0
              )
            done < <(
              find "$GITHUB_WORKSPACE" -type f \
                -iname 'ToracoKeyAI*.zip' -print0
            )
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::ToracoKey Android project not found."
            echo "The project must be at the repository root or inside a committed ZIP."
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -print | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Diagnose v0.45.0 sources
        shell: bash
        run: |
          set -uo pipefail
          cd "$PROJECT_DIR"

          FAILED=0

          check_file() {
            if [[ -s "$1" ]]; then
              echo "PASS: $1"
            else
              echo "FAIL: $1"
              FAILED=1
            fi
          }

          check_text() {
            local pattern="$1"
            local file="$2"

            if grep -Fq "$pattern" "$file"; then
              echo "PASS: Found '$pattern' in $file"
            else
              echo "FAIL: Missing '$pattern' in $file"
              FAILED=1
            fi
          }

          echo "=== Project location ==="
          pwd

          echo
          echo "=== Required files ==="
          check_file app/src/main/AndroidManifest.xml
          check_file app/src/main/assets/toracokey_words.tsv.gz
          check_file app/src/main/java/com/toracokey/ai/DeviceControl.kt
          check_file app/src/main/java/com/toracokey/ai/KeyboardMode.kt
          check_file app/src/main/java/com/toracokey/ai/WordSuggestions.kt
          check_file app/src/main/java/com/toracokey/ai/VoiceInputActivity.kt
          check_file app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          echo
          echo "=== Version checks ==="
          check_text 'versionName = "0.45.0"' app/build.gradle.kts
          check_text 'versionCode = 56' app/build.gradle.kts

          echo
          echo "=== Typing and AI controls ==="
          if grep -Fq 'typingEnabled' \
            app/src/main/java/com/toracokey/ai/DeviceControl.kt; then
            echo "PASS: typingEnabled found"
          else
            echo "FAIL: typingEnabled not found"
            FAILED=1
          fi

          if grep -Fq 'aiEnabled' \
            app/src/main/java/com/toracokey/ai/DeviceControl.kt; then
            echo "PASS: aiEnabled found"
          else
            echo "FAIL: aiEnabled not found"
            FAILED=1
          fi

          echo
          echo "=== Keyboard modes ==="
          cat app/src/main/java/com/toracokey/ai/KeyboardMode.kt

          echo
          echo "=== Diagnostic result ==="
          if [[ "$FAILED" -ne 0 ]]; then
            echo "::error::One or more source checks failed. See the FAIL lines above."
            exit 1
          fi

          echo "All required source checks passed."

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean --no-daemon --stacktrace

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::Debug APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" \
              -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.45.0-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
