name: Build ToracoKey AI v0.48.1 - Dictionary Suggestions Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK and install required packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK was not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Verify project and dictionary assets
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -s app/src/main/assets/toracokey_words.tsv.gz
          test -s app/src/main/assets/gboard_shortcuts.tsv

          grep -Fq 'versionName = "0.48.1"' app/build.gradle.kts
          grep -Fq 'versionCode = 60' app/build.gradle.kts
          grep -Fq 'const val APP_VERSION = "0.48.1"' \
            app/src/main/java/com/toracokey/ai/DeviceControl.kt
          grep -Fq 'Deduplicate defensively' \
            app/src/main/java/com/toracokey/ai/WordSuggestions.kt

          python3 - <<'PYCODE'
          import gzip
          from pathlib import Path

          p = Path('app/src/main/assets/toracokey_words.tsv.gz')

          with gzip.open(p, 'rt', encoding='utf-8') as f:
              rows = [line.rstrip('\n') for line in f if line.strip()]

          words = [
              row.split('\t', 1)[0].strip().lower()
              for row in rows
              if '\t' in row
          ]

          if not words:
              raise SystemExit(
                  'Dictionary asset is empty or malformed'
              )

          if len(words) != len(set(words)):
              raise SystemExit(
                  'Duplicate normalized words found in dictionary asset'
              )

          print(f'Validated {len(words)} unique dictionary words')
          PYCODE

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.48.1-Dictionary-Suggestions-Fix
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
