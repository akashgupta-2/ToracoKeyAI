name: Build ToracoKey AI - Reliable Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Locate ToracoKey AI Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Android project..."

          PROJECT=""

          if [ -f "settings.gradle.kts" ] && [ -d "app" ]; then
            PROJECT="$PWD"
          else
            while IFS= read -r -d '' SETTINGS; do
              DIR="$(dirname "$SETTINGS")"

              if [ -d "$DIR/app" ]; then
                PROJECT="$DIR"
                break
              fi
            done < <(
              find "$PWD" \
                -type f \
                -name "settings.gradle.kts" \
                -print0
            )
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Could not locate an Android Gradle project."
            echo
            echo "Found settings.gradle.kts files:"
            find "$PWD" -type f -name "settings.gradle.kts" -print || true
            exit 1
          fi

          echo "ToracoKey AI project:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Verify project files
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          echo "Project: $PROJECT"
          echo

          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/build.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -d "$PROJECT/app/src/main"

          echo "Required Android project files found."
          echo

          echo "Application version configuration:"
          grep -nE \
            'versionCode|versionName|com.android.application' \
            "$PROJECT/app/build.gradle.kts" \
            "$PROJECT/build.gradle.kts" \
            2>/dev/null || true

      - name: Verify repositories
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          echo "Checking Gradle repository declarations..."

          grep -RniE \
            'google\(\)|mavenCentral\(\)|gradlePluginPortal\(\)' \
            "$PROJECT/settings.gradle.kts" \
            "$PROJECT/build.gradle.kts" \
            "$PROJECT/app/build.gradle.kts" \
            2>/dev/null || true

      - name: Test jsr305 dependency availability
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          cd "$PROJECT"

          echo "Testing dependency resolution..."
          echo "Target: com.google.code.findbugs:jsr305:3.0.2"
          echo

          gradle \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            dependencies \
            --configuration debugCompileClasspath \
            > /tmp/toracokey-dependency-test.log 2>&1 || {
              echo "Dependency test reported an error."
              echo
              tail -n 120 /tmp/toracokey-dependency-test.log
              exit 1
            }

          echo "Dependency resolution test completed."

      - name: Build debug APK
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          cd "$PROJECT"

          echo "Starting ToracoKey AI debug build..."
          echo

          BUILD_OK=0

          for ATTEMPT in 1 2 3; do
            echo "=========================================="
            echo "Gradle build attempt $ATTEMPT / 3"
            echo "=========================================="

            if gradle \
              :app:assembleDebug \
              --no-daemon \
              --stacktrace \
              --refresh-dependencies \
              --no-build-cache; then

              BUILD_OK=1
              break
            fi

            echo
            echo "Build attempt $ATTEMPT failed."

            if [ "$ATTEMPT" -lt 3 ]; then
              echo "Waiting before retry..."
              sleep 10
            fi
          done

          if [ "$BUILD_OK" -ne 1 ]; then
            echo
            echo "ERROR: ToracoKey AI APK build failed after 3 attempts."
            exit 1
          fi

          echo
          echo "ToracoKey AI APK build completed successfully."

      - name: Verify APK
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Debug APK was not produced."
            find "$PROJECT/app/build/outputs" -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-debug
          path: ${{ steps.locate.outputs.project }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
