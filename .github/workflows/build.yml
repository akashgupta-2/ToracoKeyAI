name: Build ToracoKey AI v0.38.7 Dimensions Only

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check v0.38.7 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ToracoKeyAI_v0.38.7_DIMENSIONS_ONLY.zip"

          echo "Checking for:"
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo
            echo "ERROR: v0.38.7 ZIP was not found."
            echo
            echo "Repository files:"
            find . -maxdepth 3 -type f -print | sort
            exit 1
          fi

          echo
          echo "ZIP found:"
          ls -lh "$ZIP"

      - name: Verify ZIP integrity
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ToracoKeyAI_v0.38.7_DIMENSIONS_ONLY.zip"

          unzip -t "$ZIP"

          echo
          echo "ZIP integrity check successful."

      - name: Extract v0.38.7 project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ToracoKeyAI_v0.38.7_DIMENSIONS_ONLY.zip"

          rm -rf extracted
          mkdir -p extracted

          unzip -oq "$ZIP" -d extracted

          echo
          echo "Extracted project files:"
          find extracted -maxdepth 5 -type f | sort | head -n 400

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          if [ -f "extracted/settings.gradle.kts" ] && \
             [ -d "extracted/app" ]; then
            PROJECT="$PWD/extracted"
          fi

          if [ -z "$PROJECT" ]; then
            while IFS= read -r -d '' SETTINGS; do
              DIR="$(dirname "$SETTINGS")"

              if [ -d "$DIR/app" ] && \
                 { [ -f "$DIR/app/build.gradle.kts" ] || [ -f "$DIR/app/build.gradle" ]; }; then
                PROJECT="$DIR"
                break
              fi
            done < <(
              find "$PWD/extracted" \
                -type f \
                \( \
                  -name "settings.gradle.kts" \
                  -o \
                  -name "settings.gradle" \
                \) \
                -print0
            )
          fi

          if [ -z "$PROJECT" ]; then
            echo
            echo "ERROR: Android project not found."

            echo
            echo "Gradle settings files:"
            find "$PWD/extracted" \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print || true

            echo
            echo "App directories:"
            find "$PWD/extracted" \
              -type d \
              -name "app" \
              -print || true

            exit 1
          fi

          echo
          echo "Android project:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Verify project
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Verifying ToracoKey AI v0.38.7"
          echo "Dimensions Only"
          echo "=========================================="

          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/build.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -d "$PROJECT/app/src/main"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"

          echo
          echo "Required Android project files found."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          gradle --version

      - name: Verify Gradle repositories
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          echo "Checking repositories..."

          echo
          echo "settings.gradle.kts:"
          grep -nE \
            'google|mavenCentral|gradlePluginPortal|repositories' \
            "$PROJECT/settings.gradle.kts" \
            || true

          echo
          echo "build.gradle.kts:"
          grep -nE \
            'google|mavenCentral|gradlePluginPortal|repositories' \
            "$PROJECT/build.gradle.kts" \
            || true

      - name: Build debug APK
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          cd "$PROJECT"

          echo
          echo "=========================================="
          echo "Building ToracoKey AI v0.38.7"
          echo "DIMENSIONS ONLY"
          echo "=========================================="

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            --no-build-cache

          echo
          echo "=========================================="
          echo "BUILD SUCCESSFUL"
          echo "=========================================="

      - name: Verify APK
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK:"
          echo "$APK"

          if [ ! -f "$APK" ]; then
            echo
            echo "ERROR: APK was not produced."

            find "$PROJECT/app/build/outputs" \
              -type f \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo "APK CREATED SUCCESSFULLY"
          echo "=========================================="

          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.38.7-dimensions-only-debug
          path: ${{ steps.locate.outputs.project }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
