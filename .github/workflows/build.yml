name: Build ToracoKey AI v0.37.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================================
      # 2. JDK 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. Install required Android SDK packages
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'


      # ============================================================
      # 5. Gradle 8.11.1
      # ============================================================
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'


      # ============================================================
      # 6. Find Android project
      #
      # This supports BOTH:
      #
      # A) Project files directly in repository
      #
      # B) Project stored inside a ZIP
      #
      # No ZIP filename is hard-coded.
      # ============================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "======================================"

          PROJECT_DIR=""

          # --------------------------------------------------------
          # First: check if project is already at repository root
          # --------------------------------------------------------
          if [ -f "settings.gradle.kts" ] && \
             [ -f "build.gradle.kts" ] && \
             [ -f "app/build.gradle.kts" ] && \
             [ -f "app/src/main/AndroidManifest.xml" ]; then

            echo "Android project found directly in repository root."

            PROJECT_DIR="$GITHUB_WORKSPACE"

          else

            echo "Project not found at repository root."
            echo "Searching ZIP files..."

            mkdir -p extracted

            FOUND_ZIP=""

            # ------------------------------------------------------
            # Search every ZIP for a valid Android project.
            # ZIP filename does NOT matter.
            # ------------------------------------------------------
            while IFS= read -r ZIP; do

              echo ""
              echo "Checking ZIP:"
              echo "$ZIP"

              if unzip -l "$ZIP" 2>/dev/null | \
                 grep -q "settings.gradle.kts" && \
                 unzip -l "$ZIP" 2>/dev/null | \
                 grep -q "app/build.gradle.kts" && \
                 unzip -l "$ZIP" 2>/dev/null | \
                 grep -q "app/src/main/AndroidManifest.xml"; then

                echo "Valid Android project ZIP found:"
                echo "$ZIP"

                FOUND_ZIP="$ZIP"
                break

              fi

            done < <(find . -maxdepth 2 -type f -name "*.zip" | sort)

            # ------------------------------------------------------
            # Make sure a ZIP was found
            # ------------------------------------------------------
            if [ -z "$FOUND_ZIP" ]; then

              echo ""
              echo "ERROR: No valid ToracoKey Android project ZIP found."
              echo ""
              echo "Available ZIP files:"
              find . -type f -name "*.zip" -print || true

              exit 1

            fi

            # ------------------------------------------------------
            # Extract selected ZIP
            # ------------------------------------------------------
            rm -rf extracted
            mkdir -p extracted

            unzip -q "$FOUND_ZIP" -d extracted

            echo ""
            echo "ZIP extracted successfully."

            # ------------------------------------------------------
            # Find settings.gradle(.kts)
            # ------------------------------------------------------
            SETTINGS_FILE=$(find extracted \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -not -path "*/build/*" \
              -print -quit)

            if [ -z "$SETTINGS_FILE" ]; then

              echo "ERROR: Gradle settings file not found."

              find extracted \
                -maxdepth 5 \
                -type f \
                | sort \
                | head -300

              exit 1

            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          fi


          # ========================================================
          # Verify project
          # ========================================================

          echo ""
          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"

          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle.kts" || \
          test -f "$PROJECT_DIR/settings.gradle"

          test -f "$PROJECT_DIR/build.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          test -d "$PROJECT_DIR/app/src/main/java/com/toracokey/ai"

          echo ""
          echo "Android project verified successfully."

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 7. Build debug APK
      # ============================================================
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING TORACOKEY AI"
          echo "======================================"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 8. Verify APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "ERROR: APK was not created."

            echo ""
            echo "Build output:"
            find "$PROJECT_DIR/app/build" \
              -type f \
              | sort \
              | head -200 || true

            exit 1

          fi

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"


      # ============================================================
      # 9. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.37.3-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
