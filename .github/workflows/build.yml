name: Build ToracoKey AI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ToracoKey AI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Locate ToracoKey AI Android project
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="$RUNNER_TEMP/toracokey_projects"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"

          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort | head -300

          echo
          echo "Searching for Android project..."

          # Case 1: Android project is already at repository root.
          if [[ -f "settings.gradle.kts" || -f "settings.gradle" ]] && [[ -d "app" ]]; then
            echo "Android project found at repository root."
            echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
            exit 0
          fi

          # Case 2: Repository contains a ToracoKey ZIP.
          ZIP_FILE="$(find . -type f -iname 'ToracoKeyAI*.zip' -o -type f -iname 'ToracoKey*.zip' | head -1 || true)"

          if [[ -n "$ZIP_FILE" ]]; then
            echo "ToracoKey ZIP found: $ZIP_FILE"

            EXTRACT_DIR="$WORK_DIR/extracted"
            mkdir -p "$EXTRACT_DIR"

            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            echo "Searching extracted ZIP for Android project..."

            PROJECT="$(find "$EXTRACT_DIR" -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print | while read -r SETTINGS; do
              DIR="$(dirname "$SETTINGS")"
              if [[ -d "$DIR/app" ]]; then
                echo "$DIR"
                break
              fi
            done)"

            if [[ -n "$PROJECT" ]]; then
              echo "Android project found:"
              echo "$PROJECT"
              echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          # Case 3: Search the repository for a nested Android project.
          PROJECT="$(find . -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print | while read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"
            if [[ -d "$DIR/app" ]]; then
              echo "$DIR"
              break
            fi
          done)"

          if [[ -n "$PROJECT" ]]; then
            PROJECT="$(cd "$PROJECT" && pwd)"
            echo "Nested Android project found:"
            echo "$PROJECT"
            echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::error::Could not find a valid Android Gradle project."
          echo "Expected settings.gradle(.kts) and app/."
          exit 1

      - name: Verify ToracoKey AI source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Project:"
          pwd
          echo

          echo "Checking required Android files..."

          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -d app
          test -f app/build.gradle.kts || test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Required project files found."
          echo

          echo "Checking source tree..."
          find app/src/main -maxdepth 4 -type f | sort | head -300

          echo
          echo "Source verification completed."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Building from:"
          pwd
          echo

          if [[ -f gradlew ]]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"

          if [[ -z "$APK" ]]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          echo "$APK"

          echo
          echo "APK size:"
          du -h "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-debug
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
