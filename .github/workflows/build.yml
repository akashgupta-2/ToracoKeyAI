name: Build ToracoKey AI v0.38.5

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Locate ToracoKey AI Android project
        shell: bash
        run: |
          set -euo pipefail

          is_project() {
            local d="$1"
            test -f "$d/settings.gradle.kts" && \
            test -f "$d/build.gradle.kts" && \
            test -f "$d/gradle.properties" && \
            test -f "$d/app/build.gradle.kts" && \
            test -f "$d/app/src/main/AndroidManifest.xml" && \
            test -f "$d/app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt" && \
            test -f "$d/app/src/main/java/com/toracokey/ai/ToracoKeyService.kt"
          }

          PROJECT_DIR=""

          if is_project "$GITHUB_WORKSPACE"; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
            echo "Android project found at repository root."
          fi

          if [ -z "$PROJECT_DIR" ]; then
            EXTRACT_ROOT="$RUNNER_TEMP/toracokey_projects"
            rm -rf "$EXTRACT_ROOT"
            mkdir -p "$EXTRACT_ROOT"

            mapfile -t ZIPS < <(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name 'ToracoKeyAI*.zip' \
                -print
            )

            if [ "${#ZIPS[@]}" -eq 0 ]; then
              echo "No ToracoKeyAI*.zip found."
              exit 1
            fi

            i=0

            for ZIP in "${ZIPS[@]}"; do
              i=$((i + 1))

              CANDIDATE="$EXTRACT_ROOT/candidate_$i"

              mkdir -p "$CANDIDATE"

              echo "Inspecting: $ZIP"

              unzip -q "$ZIP" -d "$CANDIDATE"

              while IFS= read -r SETTINGS; do
                D="$(dirname "$SETTINGS")"

                if is_project "$D"; then
                  PROJECT_DIR="$D"

                  echo "Android project found inside: $ZIP"
                  echo "Project directory: $PROJECT_DIR"

                  break 2
                fi

              done < <(
                find "$CANDIDATE" \
                  -type f \
                  -name 'settings.gradle.kts' \
                  -print
              )
            done
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find a valid ToracoKey AI Android project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -s app/src/main/assets/toracokey_words.tsv.gz

          test -f app/src/main/java/com/toracokey/ai/WordSuggestions.kt
          test -f app/src/main/java/com/toracokey/ai/DeviceControl.kt
          test -f app/src/main/java/com/toracokey/ai/VoiceInputActivity.kt
          test -f app/src/main/java/com/toracokey/ai/KeyboardMode.kt

          grep -Fq 'versionName = "0.38.5"' \
            app/build.gradle.kts

          grep -Fq 'private val rowHeight = dp(75)' \
            app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          grep -Fq 'private lateinit var modeButton: Button' \
            app/src/main/java/com/toracokey/ai/ToracoKeyService.kt

          grep -Fq 'private fun fillSuggestions' \
            app/src/main/java/com/toracokey/ai/WordSuggestions.kt

          echo "Required ToracoKey AI source files verified."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -s app/build/outputs/apk/debug/app-debug.apk

          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.38.5-Aligned-Geometry-Suggestions-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
