name: Build ToracoKey AI v0.48.1 - Dictionary Suggestions Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate Android SDK and install required packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK was not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project and dictionary assets
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android project files..."

          test -f settings.gradle.kts
          test -f app/build.gradle.kts

          echo "Checking dictionary assets..."

          test -s app/src/main/assets/toracokey_words.tsv.gz
          test -s app/src/main/assets/gboard_shortcuts.tsv

          echo "Validating dictionary contents..."

          python3 - <<'PYCODE'
          import gzip
          from pathlib import Path
          from collections import Counter

          path = Path(
              "app/src/main/assets/toracokey_words.tsv.gz"
          )

          with gzip.open(path, "rt", encoding="utf-8") as f:
              rows = [
                  line.strip()
                  for line in f
                  if line.strip()
              ]

          words = []

          for row in rows:
              word = row.split("\t", 1)[0].strip().casefold()
              if word:
                  words.append(word)

          if not words:
              raise SystemExit("ERROR: Dictionary is empty.")

          counts = Counter(words)
          unique_count = len(counts)
          duplicate_count = sum(
              count - 1 for count in counts.values()
          )

          print(f"Dictionary entries: {len(words)}")
          print(f"Unique normalized words: {unique_count}")
          print(f"Duplicate entries: {duplicate_count}")

          if duplicate_count:
              print(
                  "::warning::Duplicate normalized words "
                  "were found. Continuing the build."
              )

          print("Dictionary asset is readable.")
          PYCODE

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-Dictionary-Suggestions-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
