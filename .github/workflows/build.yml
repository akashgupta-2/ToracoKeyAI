name: Build ToracoKey AI v0.37.5 - Clean Suggestions + Voice

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Find ToracoKey ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="ToracoKeyAI_v0.37.5_CLEAN_SUGGESTIONS_VOICE.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            echo ""
            echo "Files in repository:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Found project ZIP:"
          ls -lh "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ToracoKey project
        shell: bash
        run: |
          set -e

          rm -rf toracokey-build
          mkdir -p toracokey-build

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d toracokey-build

          echo ""
          echo "Extracted project files:"
          find toracokey-build -maxdepth 4 -type f | sort | head -250

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_SETTINGS=$(find "$GITHUB_WORKSPACE/toracokey-build" \
            -type f \
            -name "settings.gradle.kts" \
            -print \
            -quit)

          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            echo ""
            echo "Full extracted ZIP contents:"
            find "$GITHUB_WORKSPACE/toracokey-build" \
              -maxdepth 6 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PROJECT_SETTINGS")

          echo ""
          echo "Android project found:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          echo ""
          echo "Android project structure OK."

      - name: Check clean project
        shell: bash
        run: |
          set -e

          echo "Checking for unwanted files..."

          BAD_FILES=$(find "$PROJECT_ROOT" \
            \( -name "*.apk" \
            -o -name "*.aab" \
            -o -name ".DS_Store" \
            -o -name "Thumbs.db" \
            -o -name "*.log" \
            \) \
            -type f \
            -print)

          if [ -n "$BAD_FILES" ]; then
            echo "WARNING: Unwanted files found:"
            echo "$BAD_FILES"
          else
            echo "No unwanted APK/log/system files found."
          fi

      - name: Check suggestion dictionary
        shell: bash
        run: |
          DICTIONARY="$PROJECT_ROOT/app/src/main/assets/toracokey_words.tsv.gz"

          if [ -f "$DICTIONARY" ]; then
            echo "Suggestion dictionary found:"
            ls -lh "$DICTIONARY"
          else
            echo "ERROR: Suggestion dictionary is missing."
            exit 1
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "======================================"
          echo "Building ToracoKey AI v0.37.5"
          echo "======================================"

          echo "Project directory:"
          pwd

          echo ""
          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Starting Android build..."

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.37.5-Clean-Suggestions-Voice-debug
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
