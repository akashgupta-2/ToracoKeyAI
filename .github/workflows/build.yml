name: Build ToracoKey AI v0.38.3 - Gboard Geometry Black Grey Unique Suggestions

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      # The repository may contain the Android project directly OR contain the
      # project inside a ToracoKeyAI*.zip. Never fail before locating it.
      - name: Locate ToracoKey AI Android project
        shell: bash
        run: |
          set -euo pipefail

          is_project() {
            local d="$1"
            test -f "$d/settings.gradle.kts" && \
            test -f "$d/build.gradle.kts" && \
            test -f "$d/gradle.properties" && \
            test -f "$d/app/build.gradle.kts" && \
            test -f "$d/app/src/main/AndroidManifest.xml" && \
            test -f "$d/app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt" && \
            test -f "$d/app/src/main/java/com/toracokey/ai/ToracoKeyService.kt"
          }

          PROJECT_DIR=""

          if is_project "$GITHUB_WORKSPACE"; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
            echo "Found Android project at repository root."
          else
            EXTRACT_ROOT="$RUNNER_TEMP/toracokey_candidates"
            rm -rf "$EXTRACT_ROOT"
            mkdir -p "$EXTRACT_ROOT"

            mapfile -t ZIPS < <(find "$GITHUB_WORKSPACE" -type f -name 'ToracoKeyAI*.zip' -print)

            if [ "${#ZIPS[@]}" -eq 0 ]; then
              echo "No ToracoKeyAI*.zip found and no Android project exists at repository root."
              exit 1
            fi

            i=0

            for ZIP in "${ZIPS[@]}"; do
              i=$((i + 1))
              CANDIDATE="$EXTRACT_ROOT/candidate_$i"

              mkdir -p "$CANDIDATE"

              echo "Inspecting ZIP: $ZIP"

              unzip -q "$ZIP" -d "$CANDIDATE"

              FOUND=""

              while IFS= read -r SETTINGS; do
                D="$(dirname "$SETTINGS")"

                if is_project "$D"; then
                  FOUND="$D"
                  break
                fi
              done < <(find "$CANDIDATE" -type f -name 'settings.gradle.kts' -print)

              if [ -n "$FOUND" ]; then
                PROJECT_DIR="$FOUND"

                echo "Found Android project inside: $ZIP"
                echo "Project directory: $PROJECT_DIR"

                break
              fi
            done
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "No valid ToracoKey AI Android project could be located."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using PROJECT_DIR=$PROJECT_DIR"

      - name: Verify ToracoKey AI source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -s app/src/main/assets/toracokey_words.tsv.gz

          grep -Fq 'versionCode = 49' app/build.gradle.kts
          grep -Fq 'versionName = "0.38.3"' app/build.gradle.kts

          grep -Fq 'private val rowHeight = dp(66)' \
            app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          grep -Fq 'addView(android.view.View(context), LayoutParams(-1, dp(6)))' \
            app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          grep -Fq 'key(bottom, "SPACE", 4.4f)' \
            app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          grep -Fq 'Color.rgb(104, 107, 112)' \
            app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          grep -Fq 'Color.BLACK' \
            app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          grep -Fq 'setMargins(dp(2), dp(1), dp(2), dp(1))' \
            app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          grep -Fq 'addChip("Mode: ${modeName()}") { cycleMode() }' \
            app/src/main/java/com/toracokey/ai/ToracoKeyService.kt

          grep -Fq 'suggestions.addView(b, LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, dp(44))' \
            app/src/main/java/com/toracokey/ai/ToracoKeyService.kt

          grep -Fq '"shorter" to "i than now version one"' \
            app/src/main/java/com/toracokey/ai/WordSuggestions.kt

          if grep -Fq 'private private val' \
            app/src/main/java/com/toracokey/ai/ToracoKeyService.kt; then

            echo 'Invalid duplicated private modifier remains.'
            exit 1
          fi

          echo 'Source verification passed.'

      - name: Verify keyboard geometry, theme and suggestions
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -Fq 'Color.rgb(112, 115, 120)' \
            app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          grep -Fq 'Color.rgb(50, 52, 55)' \
            app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          grep -Fq 'distinctBy { it.lowercase(Locale.ROOT) }' \
            app/src/main/java/com/toracokey/ai/ToracoKeyService.kt

          grep -Fq 'private fun suggestionFamily(word: String)' \
            app/src/main/java/com/toracokey/ai/WordSuggestions.kt

          grep -Fq 'private fun nextWord(words: List<String>, limit: Int)' \
            app/src/main/java/com/toracokey/ai/WordSuggestions.kt

          echo 'Gboard-style geometry, grey-to-black theme and unique/contextual suggestions verified.'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f app/build/outputs/apk/debug/app-debug.apk

          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.38.3-GBoard-Geometry-Black-Grey-Unique-Suggestions-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
