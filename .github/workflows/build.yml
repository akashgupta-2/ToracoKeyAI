
name: Build ToracoKey AI v0.48.0 - Dictionary Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project files
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Android project files found."

      - name: Verify dictionary assets
        shell: bash
        run: |
          set -e
          find app/src/main -type f \
            \( -iname '*word*' -o -iname '*dict*' -o -iname '*.tsv.gz' \) \
            -print

      - name: Verify app version
        run: |
          grep -n 'versionName' app/build.gradle.kts || true
          grep -n 'versionCode' app/build.gradle.kts || true

      - name: Check Kotlin compilation
        run: |
          gradle :app:compileDebugKotlin \
            --no-daemon \
            --stacktrace

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.48.0-Dictionary-Update
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
