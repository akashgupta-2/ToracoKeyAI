name: Build ToracoKey AI v0.38.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      # ------------------------------------------------------------
      # Find the real Android project.
      #
      # The repository may contain:
      #
      # 1. Android project directly at root
      # 2. ToracoKeyAI ZIP
      # 3. ZIP containing a folder containing the Android project
      #
      # We locate the project instead of assuming its position.
      # ------------------------------------------------------------
      - name: Locate ToracoKey AI Android project
        shell: bash
        run: |
          set -euo pipefail

          is_project() {
            local d="$1"

            test -f "$d/settings.gradle.kts" &&
            test -f "$d/build.gradle.kts" &&
            test -f "$d/gradle.properties" &&
            test -f "$d/app/build.gradle.kts" &&
            test -f "$d/app/src/main/AndroidManifest.xml"
          }

          PROJECT_DIR=""

          # --------------------------------------------------------
          # Case 1: Android project already exists at repository root
          # --------------------------------------------------------
          if is_project "$GITHUB_WORKSPACE"; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
            echo "Android project found at repository root."

          else
            # ------------------------------------------------------
            # Case 2: Find ToracoKeyAI ZIP anywhere in repository
            # ------------------------------------------------------
            EXTRACT_ROOT="$RUNNER_TEMP/toracokey_projects"

            rm -rf "$EXTRACT_ROOT"
            mkdir -p "$EXTRACT_ROOT"

            mapfile -t ZIPS < <(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname 'ToracoKeyAI*.zip' \
                -print
            )

            echo "Found ${#ZIPS[@]} ToracoKeyAI ZIP file(s)."

            if [ "${#ZIPS[@]}" -eq 0 ]; then
              echo "ERROR: No Android project or ToracoKeyAI ZIP found."
              echo "Repository contents:"
              find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -print
              exit 1
            fi

            INDEX=0

            for ZIP in "${ZIPS[@]}"; do
              INDEX=$((INDEX + 1))

              CANDIDATE="$EXTRACT_ROOT/project_$INDEX"

              mkdir -p "$CANDIDATE"

              echo "----------------------------------------"
              echo "Inspecting:"
              echo "$ZIP"
              echo "----------------------------------------"

              unzip -q "$ZIP" -d "$CANDIDATE"

              # Search for settings.gradle.kts anywhere inside ZIP.
              while IFS= read -r SETTINGS_FILE; do

                POSSIBLE_PROJECT="$(dirname "$SETTINGS_FILE")"

                if is_project "$POSSIBLE_PROJECT"; then
                  PROJECT_DIR="$POSSIBLE_PROJECT"

                  echo "Android project found:"
                  echo "$PROJECT_DIR"

                  break
                fi

              done < <(
                find "$CANDIDATE" \
                  -type f \
                  -name "settings.gradle.kts" \
                  -print
              )

              if [ -n "$PROJECT_DIR" ]; then
                break
              fi
            done
          fi

          # --------------------------------------------------------
          # Final project check
          # --------------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not locate a valid Android project."

            echo ""
            echo "Extracted/searchable files:"
            find "${EXTRACT_ROOT:-$GITHUB_WORKSPACE}" \
              -maxdepth 6 \
              -type f \
              -print | head -300

            exit 1
          fi

          echo ""
          echo "========================================"
          echo "USING ANDROID PROJECT:"
          echo "$PROJECT_DIR"
          echo "========================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Lightweight verification only.
      #
      # NO brittle source grep checks here.
      # Gradle is responsible for validating the actual project.
      # ------------------------------------------------------------
      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Project:"
          pwd

          echo ""
          echo "Checking required Android files..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Required project files found."

          echo ""
          echo "Checking application version..."

          grep -Fq 'versionName = "0.38.3"' app/build.gradle.kts

          echo "ToracoKey AI v0.38.3 source detected."

      # ------------------------------------------------------------
      # Build the actual Android application.
      # ------------------------------------------------------------
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Starting Gradle build..."

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # ------------------------------------------------------------
      # Confirm APK exists.
      # ------------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"
          echo ""
          ls -lh "$APK"

      # ------------------------------------------------------------
      # Upload APK
      # ------------------------------------------------------------
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.38.3-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
