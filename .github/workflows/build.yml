- name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ToracoKeyAI_v0.48.0_DICTIONARY_AI_CLEANUP.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Project ZIP not found: $ZIP"
            echo "ZIP files available:"
            find . -maxdepth 2 -type f -name '*.zip'
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          echo "Searching for Android project files..."
          find extracted -type f \
            \( -name 'gradlew' -o -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \) -print

          GRADLE_FILE="$(find extracted -type f -name gradlew -print -quit)"

          if [ -n "$GRADLE_FILE" ]; then
            PROJECT_DIR="$(dirname "$GRADLE_FILE")"
          else
            SETTINGS_FILE="$(find extracted -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -print -quit)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: No Gradle project found inside ZIP."
              echo "The ZIP may not contain the Android source project."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          elif command -v gradle >/dev/null 2>&1; then
            gradle :app:assembleDebug --no-daemon --stacktrace
          else
            echo "ERROR: No Gradle wrapper or installed Gradle found."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.48.0-Dictionary-Update
          path: |
            extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
