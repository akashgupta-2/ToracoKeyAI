name: Build ToracoKey AI v0.37.8

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            FOUND="$(find . -type f -name "settings.gradle.kts" -print -quit)"

            if [ -n "$FOUND" ]; then
              PROJECT_DIR="$(dirname "$FOUND")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "Repository contents:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show project files
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Check suggestion dictionary
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "app/src/main/assets/toracokey_words.tsv.gz" ]; then
            echo "Suggestion dictionary found."
            ls -lh "app/src/main/assets/toracokey_words.tsv.gz"
          else
            echo "WARNING: suggestion dictionary not found."
            echo "Continuing because the Android project may use another suggestion source."
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            find app/build -type f | sort || true
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.37.8-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
