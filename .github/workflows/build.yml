name: Build ToracoKey AI v0.38.6

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check v0.38.6 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ToracoKeyAI_v0.38.6_ALIGNED_BOTTOM_ROW_GBOARD_SUGGESTIONS.zip"

          echo "Checking for:"
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo
            echo "ERROR: v0.38.6 ZIP was not found."
            echo
            echo "Files in repository:"
            find . -maxdepth 3 -type f -print | sort
            exit 1
          fi

          echo
          echo "ZIP found successfully:"
          ls -lh "$ZIP"

      - name: Verify ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ToracoKeyAI_v0.38.6_ALIGNED_BOTTOM_ROW_GBOARD_SUGGESTIONS.zip"

          echo "Testing ZIP integrity..."

          unzip -t "$ZIP"

          echo
          echo "ZIP integrity check successful."

      - name: Extract v0.38.6 project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ToracoKeyAI_v0.38.6_ALIGNED_BOTTOM_ROW_GBOARD_SUGGESTIONS.zip"

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP"

          unzip -oq "$ZIP" -d extracted

          echo
          echo "Extracted project:"
          find extracted -maxdepth 4 -type f | sort | head -n 300

      - name: Locate extracted Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          if [ -f "extracted/settings.gradle.kts" ] && \
             [ -d "extracted/app" ]; then
            PROJECT="$PWD/extracted"
          fi

          if [ -z "$PROJECT" ]; then
            while IFS= read -r -d '' SETTINGS; do
              DIR="$(dirname "$SETTINGS")"

              if [ -d "$DIR/app" ] && \
                 { [ -f "$DIR/app/build.gradle.kts" ] || [ -f "$DIR/app/build.gradle" ]; }; then
                PROJECT="$DIR"
                break
              fi
            done < <(
              find "$PWD/extracted" \
                -type f \
                \( \
                  -name "settings.gradle.kts" \
                  -o \
                  -name "settings.gradle" \
                \) \
                -print0
            )
          fi

          if [ -z "$PROJECT" ]; then
            echo
            echo "ERROR: Android project could not be located."

            echo
            echo "Extracted files:"
            find "$PWD/extracted" -maxdepth 6 -type f -print | sort

            exit 1
          fi

          echo
          echo "Android project found:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Verify v0.38.6 project
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Verifying ToracoKey AI v0.38.6"
          echo "=========================================="

          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/build.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -d "$PROJECT/app/src/main"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"

          echo
          echo "Required project files found."

          echo
          echo "Gradle configuration:"
          sed -n '1,240p' "$PROJECT/settings.gradle.kts"

          echo
          echo "App configuration:"
          sed -n '1,260p' "$PROJECT/app/build.gradle.kts"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Verify Gradle environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          gradle --version

          echo
          echo "Android SDK:"
          sdkmanager --list_installed | head -n 80

      - name: Verify repositories
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checking Maven repositories"
          echo "=========================================="

          echo
          echo "settings.gradle.kts:"
          grep -nE \
            'google|mavenCentral|gradlePluginPortal|repositories' \
            "$PROJECT/settings.gradle.kts" \
            || true

          echo
          echo "build.gradle.kts:"
          grep -nE \
            'google|mavenCentral|gradlePluginPortal|repositories' \
            "$PROJECT/build.gradle.kts" \
            || true

          echo
          echo "Repository check completed."

      - name: Build debug APK
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          cd "$PROJECT"

          echo
          echo "=========================================="
          echo "Building ToracoKey AI v0.38.6"
          echo "=========================================="

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            --no-build-cache

          echo
          echo "=========================================="
          echo "BUILD SUCCESSFUL"
          echo "=========================================="

      - name: Verify APK
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -euo pipefail

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK:"
          echo "$APK"

          if [ ! -f "$APK" ]; then
            echo
            echo "ERROR: APK was not produced."

            echo
            echo "Available output files:"
            find "$PROJECT/app/build/outputs" \
              -type f \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo "APK CREATED SUCCESSFULLY"
          echo "=========================================="

          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.38.6-debug
          path: ${{ steps.locate.outputs.project }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14 
