name: Build ToracoKey AI v0.38.1 - GBoard Geometry Color Suggestions

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Verify ToracoKey AI project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          test -d app/src/main/java/com/toracokey/ai
          test -f app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt
          test -f app/src/main/java/com/toracokey/ai/ToracoKeyService.kt
          test -f app/src/main/java/com/toracokey/ai/WordSuggestions.kt

          echo "Project root: $(pwd)"
          echo "Gradle project files found."

      - name: Verify v0.38.1 keyboard geometry
        shell: bash
        run: |
          set -euo pipefail

          grep -q "private val rowHeight = dp(56)" \
            app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          grep -q "setMargins(dp(3), dp(2), dp(3), dp(2))" \
            app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          grep -q "dp(38)" \
            app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          grep -q "setColors(colors)" \
            app/src/main/java/com/toracokey/ai/QwertyKeyboard.kt

          echo "v0.38.1 keyboard geometry verified."

      - name: Verify GBoard-like black theme
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            'android:windowBackground">@android:color/black' \
            app/src/main/res/values/styles.xml

          grep -q \
            'android:navigationBarColor">@android:color/black' \
            app/src/main/res/values/styles.xml

          echo "Black keyboard/window theme verified."

      - name: Verify unique suggestions
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            "distinctBy { it.lowercase(Locale.ROOT) }" \
            app/src/main/java/com/toracokey/ai/ToracoKeyService.kt

          test -s app/src/main/assets/toracokey_words.tsv.gz

          echo "Suggestion dictionary and duplicate filtering verified."

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'versionCode = 47' app/build.gradle.kts
          grep -q 'versionName = "0.38.1"' app/build.gradle.kts

          echo "ToracoKey AI v0.38.1 / versionCode 47 verified."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          test -f app/build/outputs/apk/debug/app-debug.apk

          ls -lh app/build/outputs/apk/debug/app-debug.apk

          echo "APK verification successful."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.38.1-GBoard-Geometry-Color-Suggestions-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
