name: Build ToracoKey AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Find Android project
        shell: bash
        run: |
          echo "Searching for Android project..."
          find . -maxdepth 4 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

      - name: Build APK
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle.kts" ]; then
            echo "Found Android project in root"
            PROJECT_DIR="."
          elif [ -f "settings.gradle" ]; then
            echo "Found Android project in root"
            PROJECT_DIR="."
          else
            PROJECT_DIR=$(find . -maxdepth 4 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Android project not found"
              exit 1
            fi

            echo "Found Android project at: $PROJECT_DIR"
          fi

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo "Project files:"
          ls -la

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            echo "gradlew not found. Using installed Gradle."
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-GBoard-Number-Page-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
