name: Build ToracoKey AI - Dimensions Only

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure
        shell: bash
        run: |
          set -e

          echo "Repository:"
          pwd
          echo

          find . -maxdepth 4 -type f -print | sort | head -500

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Extract ToracoKey AI project
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP..."

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -iname '*.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo
          echo "Extraction completed."

          echo
          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 6 \
            -type f \
            -print \
            | sort \
            | head -500

      - name: Locate Android Gradle project
        id: locate
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/extracted"

          SETTINGS_FILE="$(find "$ROOT" \
            -type f \
            -name 'settings.gradle.kts' \
            -print \
            -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify project files
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -e

          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/build.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -d "$PROJECT/app/src/main"

          echo "Android project verified."

      - name: Fix invalid fillViewport reference
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -e

          SERVICE_FILE="$PROJECT/app/src/main/java/com/toracokey/ai/ToracoKeyService.kt"

          if [ ! -f "$SERVICE_FILE" ]; then
            echo "ERROR: ToracoKeyService.kt not found."
            exit 1
          fi

          echo "Checking ToracoKeyService.kt..."

          echo
          echo "Before fix:"
          nl -ba "$SERVICE_FILE" | sed -n '315,340p'

          echo
          echo "Searching for fillViewport..."

          grep -n -C 3 \
            'fillViewport' \
            "$SERVICE_FILE" \
            || true

          echo
          echo "Removing invalid standalone fillViewport assignment..."

          python3 - "$SERVICE_FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          lines = text.splitlines()

          changed = False
          output = []

          for line in lines:
              stripped = line.strip()

              if stripped in (
                  "fillViewport = true",
                  "fillViewport = false",
              ):
                  output.append(
                      line.split("fillViewport", 1)[0]
                      + "// fillViewport removed: invalid unresolved reference"
                  )
                  changed = True
              else:
                  output.append(line)

          path.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )

          if changed:
              print("fillViewport fix applied.")
          else:
              print("No standalone fillViewport assignment found.")
          PY

          echo
          echo "After fix:"
          nl -ba "$SERVICE_FILE" | sed -n '315,340p'

          echo
          echo "Remaining fillViewport references:"
          grep -n -C 3 \
            'fillViewport' \
            "$SERVICE_FILE" \
            || true

      - name: Verify dimensions-only scope
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -e

          echo "=========================================="
          echo "DIMENSIONS-ONLY BUILD"
          echo "=========================================="

          echo
          echo "Authorization:"
          echo "UNCHANGED"

          echo
          echo "Suggestions:"
          echo "UNCHANGED"

          echo
          echo "Voice:"
          echo "UNCHANGED"

          echo
          echo "Backend:"
          echo "UNCHANGED"

          echo
          echo "Only build-blocking fillViewport source reference was removed."

      - name: Clean project
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -e

          cd "$PROJECT"

          gradle \
            clean \
            --no-daemon \
            --stacktrace

      - name: Build debug APK
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -e

          cd "$PROJECT"

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            --no-build-cache

      - name: Verify APK
        shell: bash
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
        run: |
          set -e

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."

            echo
            echo "Available build files:"

            find "$PROJECT/app/build" \
              -type f \
              -print \
              2>/dev/null \
              | sort || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo "APK CREATED SUCCESSFULLY"
          echo "=========================================="
          echo

          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-Dimensions-Only-debug
          path: ${{ steps.locate.outputs.project }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
