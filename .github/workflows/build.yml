
name: Build ToracoKey AI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android project files..."

          if [ ! -f settings.gradle.kts ]; then
            echo "ERROR: settings.gradle.kts not found at repository root."
            echo "Repository files:"
            ls -la
            exit 1
          fi

          if [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: app/build.gradle.kts not found."
            ls -la
            exit 1
          fi

          echo "Project files found."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build -type f -name "*.apk" -print || true
            exit 1
          fi

          ls -lh "$APK"
          echo "APK generated successfully."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
