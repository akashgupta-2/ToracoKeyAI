
name: Build ToracoKey AI v0.48.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK was not found on runner."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK: $SDK_ROOT"
          ls -la "$SDK_ROOT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Check Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f settings.gradle.kts ]; then
            echo "::error::settings.gradle.kts not found at repository root."
            exit 1
          fi

          if [ ! -f app/build.gradle.kts ]; then
            echo "::error::app/build.gradle.kts not found."
            exit 1
          fi

          echo "Android project files found."

          if [ -s app/src/main/assets/toracokey_words.tsv.gz ]; then
            echo "Dictionary asset found."
          else
            echo "::warning::Dictionary asset missing or empty."
          fi

          if [ -s app/src/main/assets/gboard_shortcuts.tsv ]; then
            echo "Shortcut asset found."
          else
            echo "::warning::Shortcut asset missing or empty."
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-v0.48.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
