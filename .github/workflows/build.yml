name: Build ToracoKey AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Extract latest ToracoKey project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'ToracoKeyAI_v*.zip' | sort -V | tail -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ToracoKeyAI_v*.zip file found."
            exit 1
          fi

          echo "Using project ZIP:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/toracokey-project"
          mkdir -p "$GITHUB_WORKSPACE/toracokey-project"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/toracokey-project"

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/toracokey-project" \
            -maxdepth 4 \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/toracokey-project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.git/*" \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found inside the ToracoKey ZIP."
            echo ""
            echo "Extracted directory:"
            find "$GITHUB_WORKSPACE/toracokey-project" -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle.kts" \
            || test -f "$PROJECT_DIR/settings.gradle"

          test -f "$PROJECT_DIR/app/build.gradle.kts" \
            || test -f "$PROJECT_DIR/app/build.gradle"

          echo "Android project structure is valid."

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f \
            -not -path "*/.git/*" \
            | sort

      - name: Verify local suggestion dictionary
        shell: bash
        run: |
          set -euo pipefail

          DICT="$PROJECT_DIR/app/src/main/assets/toracokey_words.tsv.gz"

          if [ -f "$DICT" ]; then
            echo "Suggestion dictionary found:"
            echo "$DICT"
            ls -lh "$DICT"
          else
            echo "WARNING: Suggestion dictionary not found."
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Debug APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToracoKeyAI-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
